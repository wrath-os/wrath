title = "Adding a user package installs it without NixOS evaluation and without a reboot"

[vm]
config = "fixtures/configs/basic"
steps = [
  { apply_user_config = "fixtures/configs/user-ripgrep", user = "demo", expect_log_absent = "nix eval" },
  { run_as = "demo", run = "rg --version", stdout_contains = "ripgrep" },
  { expect_no_reboot = true },
]
