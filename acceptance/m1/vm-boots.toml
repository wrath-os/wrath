title = "A minimal system boots under QEMU with UEFI and a TPM, and the guest agent answers"

[vm]
config = "fixtures/configs/native"
store = "distro"
firmware = "uefi"
tpm = true
wait_for = ["agent", "unit:multi-user.target"]
expect = [{ run = "systemctl is-system-running --wait", stdout_contains = "running" }]
