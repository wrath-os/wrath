# Mozilla's portable runtime and its cryptography and certificate libraries, which Chromium's build
# from its project links.

[[package]]
id = "nspr"
version = "4.40"
scope = "runtime"
core = true
extra_deps = ["pkgconf"]
sources = [{ url = "https://ftp.mozilla.org/pub/nspr/releases/v{version}/src/nspr-{version}.tar.gz" }]
probes = ["nspr"]
script = '''
cd nspr
./configure --prefix=$PREFIX --enable-64bit --enable-optimize --disable-debug
make
make DESTDIR=$DEST install
rm -f $DEST$PREFIX/lib/*.a
'''

# Built by its own makefiles, which install nothing: the libraries and headers are copied from
# where they leave them, with the pkg-config file distributions write.
[[package]]
id = "nss"
version = "3.133"
scope = "runtime"
core = true
extra_deps = ["pkgconf", "perl", "nspr", "sqlite", "zlib"]
sources = [{ url = "https://ftp.mozilla.org/pub/security/nss/releases/NSS_{underscored}_RTM/src/nss-{version}.tar.gz" }]
probes = ["nss"]
script = '''
cd nss
make -j1 all BUILD_OPT=1 USE_64=1 NSS_USE_SYSTEM_SQLITE=1 USE_SYSTEM_ZLIB=1 \
    ZLIB_LIBS=-lz NSS_DISABLE_GTESTS=1 NSS_ENABLE_WERROR=0 CHECKLOC= \
    NSPR_INCLUDE_DIR=$(pkg-config --variable=includedir nspr) \
    NSPR_LIB_DIR=$(pkg-config --variable=libdir nspr)
mkdir -p $DEST$PREFIX/lib/pkgconfig $DEST$PREFIX/include/nss
cp ../dist/Linux*/lib/*.so $DEST$PREFIX/lib/
cp -L ../dist/public/nss/*.h $DEST$PREFIX/include/nss/
cat > $DEST$PREFIX/lib/pkgconfig/nss.pc <<EOF
prefix=$PREFIX
libdir=\${prefix}/lib
includedir=\${prefix}/include/nss

Name: NSS
Description: Network Security Services
Version: $(sed -n 's/^#define NSS_VERSION "\([0-9.]*\).*/\1/p' lib/nss/nss.h)
Requires: nspr
Libs: -L\${libdir} -lssl3 -lsmime3 -lnss3 -lnssutil3
Cflags: -I\${includedir}
EOF
'''
