# A status bar: Waybar, and the C++ bindings to GTK 3 it's written with.

[[package]]
id = "libsigc++"
version = "2.12.1"
# gtkmm 3 needs the 2 series; 3 is gtkmm 4's.
track = "2."
scope = "runtime"
core = true
sources = [{ url = "https://download.gnome.org/sources/libsigc++/{series}/libsigc++-{version}.tar.xz" }]
probes = ["sigc++-2.0"]

# Signals and slots for C++.
[package.meson]
args = ["-D build-examples=false", "-D build-documentation=false"]

[[package]]
id = "glibmm"
version = "2.66.10"
track = "2.66."
scope = "runtime"
core = true
extra_deps = ["glib", "libsigc++"]
propagates = ["glib", "libsigc++"]
sources = [{ url = "https://download.gnome.org/sources/glibmm/{series}/glibmm-{version}.tar.xz" }]
probes = ["glibmm-2.4", "giomm-2.4"]

[package.meson]
args = ["-D build-examples=false", "-D build-documentation=false"]

[[package]]
id = "cairomm"
version = "1.14.5"
track = "1.14."
scope = "runtime"
core = true
extra_deps = ["cairo", "libsigc++"]
propagates = ["cairo", "libsigc++"]
sources = [{ url = "https://www.cairographics.org/releases/cairomm-{version}.tar.xz" }]
probes = ["cairomm-1.0"]

[package.meson]
args = ["-D build-examples=false", "-D build-documentation=false", "-D build-tests=false"]

[[package]]
id = "pangomm"
version = "2.46.5"
track = "2.46."
scope = "runtime"
core = true
extra_deps = ["pango", "glibmm", "cairomm"]
propagates = ["pango", "glibmm", "cairomm"]
sources = [{ url = "https://download.gnome.org/sources/pangomm/{series}/pangomm-{version}.tar.xz" }]
probes = ["pangomm-1.4"]

[package.meson]
args = ["-D build-documentation=false"]

[[package]]
id = "atkmm"
version = "2.28.5"
track = "2.28."
scope = "runtime"
core = true
extra_deps = ["at-spi2-core", "glibmm"]
propagates = ["at-spi2-core", "glibmm"]
sources = [{ url = "https://download.gnome.org/sources/atkmm/{series}/atkmm-{version}.tar.xz" }]
probes = ["atkmm-1.6"]

[package.meson]
args = ["-D build-documentation=false"]

[[package]]
id = "gtkmm3"
version = "3.24.11"
track = "3.24."
scope = "runtime"
core = true
extra_deps = ["gtk3", "pangomm", "atkmm"]
propagates = ["gtk3", "glibmm", "cairomm", "pangomm", "atkmm"]
sources = [{ url = "https://download.gnome.org/sources/gtkmm/{series}/gtkmm-{version}.tar.xz" }]
probes = ["gtkmm-3.0"]

[package.meson]
args = ["-D build-demos=false", "-D build-tests=false", "-D build-documentation=false"]

[[package]]
id = "fmt"
version = "12.2.1"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/fmtlib/fmt/archive/{version}/fmt-{version}.tar.gz" }]
probes = ["fmt"]

# Formatting text in C++.
[package.cmake]
args = [
  "-D BUILD_SHARED_LIBS=ON", "-D FMT_TEST=OFF", "-D FMT_DOC=OFF", "-D CMAKE_INSTALL_LIBDIR=lib",
]

[[package]]
id = "spdlog"
version = "1.17.0"
scope = "runtime"
core = true
extra_deps = ["fmt"]
propagates = ["fmt"]
sources = [{ url = "https://github.com/gabime/spdlog/archive/v{version}/spdlog-{version}.tar.gz" }]
probes = ["spdlog"]

# Logging for C++, with the fmt above instead of a copy of its own.
[package.cmake]
args = [
  "-D SPDLOG_BUILD_SHARED=ON", "-D SPDLOG_FMT_EXTERNAL=ON", "-D SPDLOG_BUILD_EXAMPLE=OFF",
  "-D SPDLOG_BUILD_TESTS=OFF", "-D CMAKE_INSTALL_LIBDIR=lib",
]

[[package]]
id = "jsoncpp"
version = "1.9.8"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/open-source-parsers/jsoncpp/archive/{version}/jsoncpp-{version}.tar.gz" }]
probes = ["jsoncpp"]

# JSON for C++.
[package.meson]
args = ["-D tests=false"]

[[package]]
id = "gtk-layer-shell"
version = "0.10.1"
scope = "runtime"
core = true
extra_deps = ["gtk3", "wayland-protocols"]
sources = [{ url = "https://github.com/wmww/gtk-layer-shell/archive/v{version}/gtk-layer-shell-{version}.tar.gz" }]
probes = ["gtk-layer-shell-0"]

# Puts a GTK 3 window on a layer of the screen, as bars and docks are.
[package.meson]
args = [
  "-D introspection=false", "-D vapi=false", "-D docs=false", "-D tests=false",
  "-D examples=false",
]

[[package]]
id = "waybar"
version = "0.16.0"
scope = "runtime"
core = true
extra_deps = [
  "gtkmm3", "gtk-layer-shell", "spdlog", "jsoncpp", "wayland-protocols", "libinput",
  "libevdev", "libnl", "wireplumber", "playerctl",
]
sources = [{ url = "https://github.com/Alexays/Waybar/archive/{version}/waybar-{version}.tar.gz" }]
smoke = ["bin/waybar --version"]

# The bar, with niri's workspaces and windows, sound, network, the media player and a tray.
[package.meson]
# Its user unit would go where systemd's pkg-config file says, which is systemd's own directory.
prepare = '''
sed -i "s#systemd.get_variable(pkgconfig: 'systemduserunitdir')#'$PREFIX/lib/systemd/user'#" \
  meson.build
'''
args = [
  "-D man-pages=disabled", "-D tests=disabled", "-D cava=disabled", "-D gps=disabled",
  "-D wwan=disabled", "-D mpd=disabled", "-D jack=disabled", "-D sndio=disabled",
  "-D pulseaudio=disabled", "-D upower_glib=disabled", "-D dbusmenu-gtk=disabled",
  "-D niri=true",
]
