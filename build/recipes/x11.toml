sources = [{ url = "https://www.x.org/archive/individual/lib/libXi-{version}.tar.xz" }]
probes = ["xi"]

[package.autotools]
args = [
  "--disable-static", "--disable-specs", "--without-xmlto", "--without-fop", "--without-asciidoc",
]

