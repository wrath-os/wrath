# X11's extension libraries, beside libX11: what GTK 3's X11 backend and programs built for X11,
# such as browsers from their projects, link even when they run on Wayland.

[[package]]
id = "libXext"
version = "1.3.7"
scope = "runtime"
core = true
extra_deps = ["pkgconf", "xorgproto", "libX11"]
sources = [{ url = "https://www.x.org/archive/individual/lib/libXext-{version}.tar.xz" }]
probes = ["xext"]

[package.autotools]
args = ["--disable-static", "--disable-specs", "--without-xmlto", "--without-fop"]

[[package]]
id = "libXfixes"
version = "6.0.2"
scope = "runtime"
core = true
extra_deps = ["pkgconf", "xorgproto", "libX11"]
sources = [{ url = "https://www.x.org/archive/individual/lib/libXfixes-{version}.tar.xz" }]
probes = ["xfixes"]

[package.autotools]
args = ["--disable-static"]

[[package]]
id = "libXrender"
version = "0.9.13"
scope = "runtime"
core = true
extra_deps = ["pkgconf", "xorgproto", "libX11"]
sources = [{ url = "https://www.x.org/archive/individual/lib/libXrender-{version}.tar.xz" }]
