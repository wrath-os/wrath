# GTK 4, which newer programs are written with, beside GTK 3.

[[package]]
id = "libtiff"
version = "4.7.2"
scope = "runtime"
core = true
extra_deps = ["zlib", "libjpeg-turbo", "zstd", "xz"]
sources = [{ url = "https://download.osgeo.org/libtiff/tiff-{version}.tar.xz" }]
probes = ["libtiff-4"]

# TIFF images, which GTK 4 loads itself.
[package.cmake]
args = [
  "-D tiff-tools=OFF", "-D tiff-tests=OFF", "-D tiff-contrib=OFF", "-D tiff-docs=OFF",
  "-D CMAKE_INSTALL_LIBDIR=lib",
]

[[package]]
id = "graphene"
version = "1.10.8"
scope = "runtime"
core = true
extra_deps = ["glib"]
sources = [{ url = "https://download.gnome.org/sources/graphene/{series}/graphene-{version}.tar.xz" }]
probes = ["graphene-gobject-1.0"]

# Vectors and matrices for GTK 4's scene graph.
[package.meson]
args = ["-D tests=false", "-D installed_tests=false", "-D introspection=disabled"]

[[package]]
id = "gtk4"
version = "4.22.5"
# 4.24 needs GLib 2.90 and Pango 1.58, which would rebuild every desktop package.
track = "4.22."
scope = "runtime"
core = true
runtime_deps = ["shared-mime-info", "hicolor-icon-theme"]
extra_deps = [
  "python3", "pango", "gdk-pixbuf", "libepoxy", "graphene", "libpng", "libjpeg-turbo",
  "shared-mime-info", "libtiff", "wayland", "wayland-protocols", "libxkbcommon", "libdrm",
  "mesa", "gettext",
]
sources = [{ url = "https://download.gnome.org/sources/gtk/{series}/gtk-{version}.tar.xz" }]
probes = ["gtk4"]
# Its programs all want a display, so the library loading is what gets checked.
smoke = ["bin/gtk4-builder-tool --help"]

# Wayland only, drawn with OpenGL, printing to files only.
[package.meson]
args = [
  "-D x11-backend=false", "-D wayland-backend=true", "-D broadway-backend=false",
  "-D media-gstreamer=disabled", "-D print-cups=disabled", "-D print-cpdb=disabled",
  "-D vulkan=disabled", "-D cloudproviders=disabled", "-D sysprof=disabled",
  "-D tracker=disabled", "-D colord=disabled", "-D accesskit=disabled",
  "-D introspection=disabled", "-D documentation=false", "-D man-pages=false",
  "-D build-demos=false", "-D build-testsuite=false", "-D build-examples=false",
  "-D build-tests=false",
]
install = '''
# The compiled schemas are made for a whole system, from every package's.
rm $DEST$PREFIX/share/glib-2.0/schemas/gschemas.compiled
# So is the MIME database, from every package's `share/mime/packages`.
find $DEST$PREFIX/share/mime -mindepth 1 -maxdepth 1 ! -name packages -exec rm -r {} +
'''
