# LLVM and clang: libclang is what bindgen reads C headers with, for Rust crates that bind to C
# libraries.

[[package]]
id = "llvm"
version = "23.1.5"
scope = "runtime"
core = true
# clang finds its own headers relative to libclang.
whole = true
silent_for = "3h"
extra_deps = ["cmake", "ninja", "python3", "zlib", "zstd"]
sources = [{ url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}/llvm-project-{version}.src.tar.xz" }]
smoke = ["bin/clang --version", "bin/llvm-config --version"]

# One shared library for LLVM and one for clang, for the x86 and AMD GPU targets.
[package.cmake]
source = "llvm"
args = [
    "-DLLVM_ENABLE_PROJECTS=clang", "-DLLVM_TARGETS_TO_BUILD=\"X86;AMDGPU\"",
    "-DLLVM_HOST_TRIPLE=$LAB_TRIPLE", "-DLLVM_BUILD_LLVM_DYLIB=ON",
    "-DLLVM_LINK_LLVM_DYLIB=ON", "-DCLANG_LINK_CLANG_DYLIB=ON", "-DLLVM_ENABLE_RTTI=ON",
    "-DLLVM_ENABLE_ZLIB=FORCE_ON", "-DLLVM_ENABLE_ZSTD=FORCE_ON", "-DLLVM_ENABLE_LIBXML2=OFF",
    "-DLLVM_INCLUDE_TESTS=OFF", "-DLLVM_INCLUDE_BENCHMARKS=OFF", "-DLLVM_INCLUDE_EXAMPLES=OFF",
    "-DLLVM_INCLUDE_DOCS=OFF", "-DCLANG_INCLUDE_TESTS=OFF", "-DCLANG_INCLUDE_DOCS=OFF",
]
