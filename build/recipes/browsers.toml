# Browsers as their projects build them. Compiling one takes Rust, clang, Node and an hour or more,
# so these take the project's own build for other distributions and point it at our loader and
# libraries instead.

# Zen, built on Firefox. Its libraries (NSS, NSPR, SQLite and its own codecs) come with it; GTK 3,
# X11's, and what it loads as it runs (Mesa, Wayland, PulseAudio through PipeWire, FFmpeg for
# video) are the system's.
[[package]]
id = "zen-browser"
version = "1.24.2b"
scope = "runtime"
core = true
extra_deps = [
  "gtk3", "glib", "at-spi2-core", "cairo", "pango", "gdk-pixbuf", "dbus", "fontconfig",
  "freetype", "alsa-lib", "libpulse", "libX11", "libxcb", "libXext", "libXrender", "libXi",
  "libXrandr", "libXcursor", "libXdamage", "libXfixes", "libXcomposite", "mesa", "libdrm",
  "wayland", "libxkbcommon", "ffmpeg", "pipewire",
]
sources = [{ url = "https://github.com/zen-browser/desktop/releases/download/{version}/zen.linux-x86_64.tar.xz" }]
smoke = ["bin/zen --version"]

# It can't update itself in the store; a new version is a new recipe.
[package.prebuilt]
dir = "zen"
programs = { zen = "zen" }
remove = ["updater", "updater.ini", "update-settings.ini"]
install = '''
mkdir -p $app/distribution
printf '{"policies": {"DisableAppUpdate": true}}\n' > $app/distribution/policies.json
for size in 16 32 48 64 128; do
    mkdir -p $DEST$PREFIX/share/icons/hicolor/${size}x${size}/apps
    cp $app/browser/chrome/icons/default/default$size.png \
        $DEST$PREFIX/share/icons/hicolor/${size}x${size}/apps/zen-browser.png
done
mkdir -p $DEST$PREFIX/share/applications
cat > $DEST$PREFIX/share/applications/zen-browser.desktop <<EOF
[Desktop Entry]
Type=Application
Name=Zen Browser
GenericName=Web Browser
Exec=zen %u
Icon=zen-browser
StartupWMClass=zen
Terminal=false
Categories=Network;WebBrowser;
MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
EOF
'''

# Firefox, as Mozilla builds it: the same libraries as Zen's.
[[package]]
id = "firefox"
version = "160.0"
scope = "runtime"
core = true
extra_deps = [
  "gtk3", "glib", "at-spi2-core", "cairo", "pango", "gdk-pixbuf", "dbus", "fontconfig",
  "freetype", "alsa-lib", "libpulse", "libX11", "libxcb", "libXext", "libXrender", "libXi",
  "libXrandr", "libXcursor", "libXdamage", "libXfixes", "libXcomposite", "mesa", "libdrm",
  "wayland", "libxkbcommon", "ffmpeg", "pipewire",
]
sources = [{ url = "https://download-installer.cdn.mozilla.net/pub/firefox/releases/{version}/linux-x86_64/en-US/firefox-{version}.tar.xz" }]
smoke = ["bin/firefox --version"]

[package.prebuilt]
programs = { firefox = "firefox" }
remove = [
  "updater", "updater.ini", "update-settings.ini", "crashreporter", "crashhelper", "firefox.sig",
  "firefox-bin.sig", "libxul.so.sig",
]
install = '''
printf '{"policies": {"DisableAppUpdate": true}}\n' > $app/distribution/policies.json
for size in 16 32 48 64 128; do
    mkdir -p $DEST$PREFIX/share/icons/hicolor/${size}x${size}/apps
    cp $app/browser/chrome/icons/default/default$size.png \
        $DEST$PREFIX/share/icons/hicolor/${size}x${size}/apps/firefox.png
done
mkdir -p $DEST$PREFIX/share/applications
cat > $DEST$PREFIX/share/applications/firefox.desktop <<EOF
[Desktop Entry]
Type=Application
Name=Firefox
GenericName=Web Browser
Exec=firefox %u
Icon=firefox
StartupWMClass=firefox
Terminal=false
Categories=Network;WebBrowser;
MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
EOF
'''
