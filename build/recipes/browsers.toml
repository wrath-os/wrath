# Browsers as their projects build them. Compiling one takes Rust, clang, Node and an hour or more,
# so these take the project's own build for other distributions and point it at our loader and
# libraries instead.

# Zen, built on Firefox. Its libraries (NSS, NSPR, SQLite and its own codecs) come with it; GTK 3,
# X11's, and what it loads as it runs (Mesa, Wayland, PulseAudio through PipeWire, FFmpeg for
# video) are the system's.
[[package]]
id = "zen-browser"
version = "1.24.2b"
scope = "runtime"
core = true
extra_deps = [
  "gtk3", "glib", "at-spi2-core", "cairo", "pango", "gdk-pixbuf", "dbus", "fontconfig",
  "freetype", "alsa-lib", "libpulse", "libX11", "libxcb", "libXext", "libXrender", "libXi",
  "libXrandr", "libXcursor", "libXdamage", "libXfixes", "libXcomposite", "mesa", "libdrm",
  "wayland", "libxkbcommon", "ffmpeg", "pipewire",
]
sources = [{ url = "https://github.com/zen-browser/desktop/releases/download/{version}/zen.linux-{arch}.tar.xz" }]
smoke = ["bin/zen --version"]

# It can't update itself in the store; a new version is a new recipe.
[package.prebuilt]
dir = "zen"
programs = { zen = "zen" }
# wrath declares the profile its settings go in (`programs.zen`), which Zen keeps only with this.
env = { MOZ_LEGACY_PROFILES = "1" }
remove = ["updater", "updater.ini", "update-settings.ini"]
install = '''
mkdir -p $app/distribution
printf '{"policies": {"DisableAppUpdate": true}}\n' > $app/distribution/policies.json
for size in 16 32 48 64 128; do
    mkdir -p $DEST$PREFIX/share/icons/hicolor/${size}x${size}/apps
    cp $app/browser/chrome/icons/default/default$size.png \
        $DEST$PREFIX/share/icons/hicolor/${size}x${size}/apps/zen-browser.png
done
mkdir -p $DEST$PREFIX/share/applications
cat > $DEST$PREFIX/share/applications/zen-browser.desktop <<EOF
[Desktop Entry]
Type=Application
Name=Zen Browser
GenericName=Web Browser
Exec=zen %u
Icon=zen-browser
StartupWMClass=zen
Terminal=false
Categories=Network;WebBrowser;
MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
EOF
'''

# Firefox, as Mozilla builds it: the same libraries as Zen's.
[[package]]
id = "firefox"
version = "160.0"
scope = "runtime"
core = true
extra_deps = [
  "gtk3", "glib", "at-spi2-core", "cairo", "pango", "gdk-pixbuf", "dbus", "fontconfig",
  "freetype", "alsa-lib", "libpulse", "libX11", "libxcb", "libXext", "libXrender", "libXi",
  "libXrandr", "libXcursor", "libXdamage", "libXfixes", "libXcomposite", "mesa", "libdrm",
  "wayland", "libxkbcommon", "ffmpeg", "pipewire",
]
sources = [{ url = "https://download-installer.cdn.mozilla.net/pub/firefox/releases/{version}/{os}-{arch}/en-US/firefox-{version}.tar.xz" }]
smoke = ["bin/firefox --version"]

[package.prebuilt]
programs = { firefox = "firefox" }
# wrath declares the profile its settings go in (`programs.firefox`), which Firefox keeps only
# with this.
env = { MOZ_LEGACY_PROFILES = "1" }
remove = [
  "updater", "updater.ini", "update-settings.ini", "crashreporter", "crashhelper", "firefox.sig",
  "firefox-bin.sig", "libxul.so.sig",
]
install = '''
printf '{"policies": {"DisableAppUpdate": true}}\n' > $app/distribution/policies.json
for size in 16 32 48 64 128; do
    mkdir -p $DEST$PREFIX/share/icons/hicolor/${size}x${size}/apps
    cp $app/browser/chrome/icons/default/default$size.png \
        $DEST$PREFIX/share/icons/hicolor/${size}x${size}/apps/firefox.png
done
mkdir -p $DEST$PREFIX/share/applications
cat > $DEST$PREFIX/share/applications/firefox.desktop <<EOF
[Desktop Entry]
Type=Application
Name=Firefox
GenericName=Web Browser
Exec=firefox %u
Icon=firefox
StartupWMClass=firefox
Terminal=false
Categories=Network;WebBrowser;
MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
EOF
'''

# Chromium, as ungoogled-chromium builds it for any distribution: Chromium without Google's
# services. Chromium's project publishes no builds for Linux, and Google's Chrome only for Debian
# and Fedora. It brings its own FFmpeg, ANGLE and Vulkan loader; its Qt shims, for a Qt look, are
# left out.
[[package]]
id = "chromium"
version = "156.0.8078.79-1"
scope = "runtime"
core = true
extra_deps = [
  "glib", "nss", "nspr", "at-spi2-core", "libcups", "dbus", "expat", "mesa", "libdrm", "systemd",
  "libX11", "libxcb", "libXcomposite", "libXdamage", "libXext", "libXfixes", "libXrandr",
  "libxkbcommon", "pango", "cairo", "gtk3", "alsa-lib", "libpulse", "pipewire", "wayland",
]
sources = [{ url = "https://github.com/ungoogled-software/ungoogled-chromium-portablelinux/releases/download/{version}/ungoogled-chromium-{version}-{arch}_{os}.tar.xz" }]
smoke = ["bin/chromium --version"]

[package.prebuilt]
programs = { chromium = "chrome" }
remove = ["libqt5_shim.so", "libqt6_shim.so", "chrome-wrapper"]
install = '''
mkdir -p $DEST$PREFIX/share/icons/hicolor/48x48/apps $DEST$PREFIX/share/applications
cp $app/product_logo_48.png $DEST$PREFIX/share/icons/hicolor/48x48/apps/chromium.png
cat > $DEST$PREFIX/share/applications/chromium.desktop <<EOF
[Desktop Entry]
Type=Application
Name=Chromium
GenericName=Web Browser
Exec=chromium %U
Icon=chromium
StartupWMClass=chromium
Terminal=false
Categories=Network;WebBrowser;
MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
EOF
'''
