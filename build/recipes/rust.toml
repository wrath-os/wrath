# Rust. `rustc` and `cargo` are prebuilt, the second thing we take on trust after the seed.

[[package]]
id = "rust-bin"
scope = "runtime"
# rustc finds its standard library relative to librustc_driver.
whole = true
core = true
sources = [{ url = "https://static.rust-lang.org/dist/rust-1.89.0-x86_64-unknown-linux-gnu.tar.xz" }]
script = '''
sh install.sh --prefix=$PREFIX --destdir=$DEST --disable-ldconfig \
    --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu
# These were linked for a system with /lib64, so each is pointed at our loader and libraries.
loader=$LAB_LIB_glibc/lib/ld-linux-x86-64.so.2
find $DEST$PREFIX/bin $DEST$PREFIX/lib -type f | while read -r file; do
    case "$file" in *.o|*.a|*.rlib|*.rmeta) continue ;; esac
    [ "$(head -c 4 "$file" | od -An -c | tr -d ' ')" = '177ELF' ] || continue
    chmod u+w "$file"
    $LAB_SEED/bin/patchelf --force-rpath \
        --set-rpath "$PREFIX/lib:$LAB_LIB_gcc/lib:$LAB_LIB_glibc/lib:$LAB_LIB_zlib/lib" "$file"
    if $LAB_SEED/bin/readelf -l "$file" | grep -q 'program interpreter'; then
        $LAB_SEED/bin/patchelf --set-interpreter "$loader" "$file"
    fi
done
'''
extra_deps = ["zlib"]
smoke = ["bin/rustc --version", "bin/cargo --version"]

[[package]]
id = "ripgrep"
scope = "runtime"
core = true
extra_deps = ["rust-bin"]
script = '''
# Cargo checks each vendored crate against a hash in this file, and its Cargo.lock has them.
awk -F'"' '
    /^name = / { name = $2 }
    /^version = / { version = $2 }
    /^checksum = / {
        printf "{\"files\":{},\"package\":\"%s\"}\n", $2 > ("vendor/" name "-" version "/.cargo-checksum.json")
    }
' Cargo.lock
mkdir -p .cargo
cat > .cargo/config.toml <<CONFIG
[source.crates-io]
replace-with = "vendored"
[source.vendored]
directory = "vendor"
CONFIG
export CARGO_HOME=/build/cargo RUSTFLAGS="--remap-path-prefix=/build/src=/src"
cargo build --release --offline --locked -j $NPROC
mkdir -p $DEST$PREFIX/bin
cp target/release/rg $DEST$PREFIX/bin/
'''
smoke = ["bin/rg --version", "sh: echo needle > /tmp/x; $OUT/bin/rg needle /tmp/x"]
sources = [
    { url = "https://github.com/BurntSushi/ripgrep/archive/14.1.1/ripgrep-14.1.1.tar.gz" },
