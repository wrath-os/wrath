# Rust. `rustc` and `cargo` are prebuilt, the second thing we take on trust after the seed.

[[package]]
id = "rust-bin"
version = "1.99.1"
scope = "runtime"
# rustc finds its standard library relative to librustc_driver.
whole = true
core = true
sources = [{ url = "https://static.rust-lang.org/dist/rust-{version}-{triple}.tar.xz" }]
script = '''
sh install.sh --prefix=$PREFIX --destdir=$DEST --disable-ldconfig \
    --components=rustc,cargo,rust-std-$LAB_TRIPLE
# These were linked for a system with /lib64, so each is pointed at our loader and libraries.
loader=$LAB_LOADER
find $DEST$PREFIX/bin $DEST$PREFIX/lib -type f | while read -r file; do
    case "$file" in *.o|*.a|*.rlib|*.rmeta) continue ;; esac
    [ "$(head -c 4 "$file" | od -An -c | tr -d ' ')" = '177ELF' ] || continue
    chmod u+w "$file"
    $LAB_SEED/bin/patchelf --force-rpath \
        --set-rpath "$PREFIX/lib:$LAB_LIB_gcc/lib:$LAB_LIB_glibc/lib:$LAB_LIB_zlib/lib" "$file"
    if $LAB_SEED/bin/readelf -l "$file" | grep -q 'program interpreter'; then
        $LAB_SEED/bin/patchelf --set-interpreter "$loader" "$file"
    fi
done
'''
extra_deps = ["zlib"]
smoke = ["bin/rustc --version", "bin/cargo --version"]

[[package]]
id = "ripgrep"
version = "14.1.1"
scope = "runtime"
core = true
extra_deps = ["rust-bin"]
sources = [{ url = "https://github.com/BurntSushi/ripgrep/archive/{version}/ripgrep-{version}.tar.gz" }]
smoke = ["bin/rg --version", "sh: echo needle > /tmp/x; $OUT/bin/rg needle /tmp/x"]

[package.cargo]
programs = ["rg"]

[[package]]
id = "jujutsu"
version = "0.34.0"
scope = "runtime"
core = true
extra_deps = ["rust-bin", "pkgconf", "openssl", "zlib"]
sources = [{ url = "https://github.com/jj-vcs/jj/archive/v{version}/jj-{version}.tar.gz" }]
smoke = ["bin/jj --version"]

# It fetches and pushes by running git.
[package.cargo]
packages = ["jj-cli"]
programs = ["jj"]
