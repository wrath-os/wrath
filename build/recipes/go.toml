# Go, and programs written in it. Go is prebuilt, taken on trust as Rust is; programs get their
# modules from their own go.sum, which Go checks them against as it builds.

[[package]]
id = "go"
version = "1.27.4"
scope = "runtime"
core = true
whole = true
sources = [{ url = "https://go.dev/dl/go{version}.linux-amd64.tar.gz" }]
script = '''
mkdir -p $DEST$PREFIX
cp -a . $DEST$PREFIX/
'''
smoke = ["bin/go version"]

[[package]]
id = "age"
version = "1.2.1"
scope = "runtime"
core = true
extra_deps = ["go"]
sources = [{ url = "https://github.com/FiloSottile/age/archive/v{version}/age-{version}.tar.gz" }]
smoke = ["bin/age --version", "bin/age-keygen -o /tmp/key"]

[package.go]
packages = ["./cmd/age", "./cmd/age-keygen"]
ldflags = "-X main.Version=v1.2.1"

[[package]]
id = "tailscale"
version = "1.86.2"
scope = "runtime"
core = true
extra_deps = ["go"]
sources = [{ url = "https://github.com/tailscale/tailscale/archive/v{version}/tailscale-{version}.tar.gz" }]
smoke = ["bin/tailscale version", "bin/tailscaled --version"]

[package.go]
packages = ["./cmd/tailscale", "./cmd/tailscaled"]
ldflags = "-X tailscale.com/version.longStamp=1.86.2 -X tailscale.com/version.shortStamp=1.86.2"
