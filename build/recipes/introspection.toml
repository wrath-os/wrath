# GObject introspection: descriptions of libraries' APIs (`.gir`), compiled to typelibs that
# bindings and tools such as blueprint-compiler read. The libraries themselves are built without
# it; each package here builds one again with it and keeps only its descriptions, so nothing that
# uses the libraries rebuilds.

# What Python programs such as the scanner load to build and find C code, now that the standard
# library has no distutils.
[[package]]
id = "setuptools"
version = "84.2.1"
scope = "runtime"
core = true
sources = [{ url = "https://files.pythonhosted.org/packages/source/s/setuptools/setuptools-{version}.tar.gz" }]
script = '''
mkdir -p $DEST$PREFIX/site
cp -r setuptools _distutils_hack $DEST$PREFIX/site/
# Python reads setuptools' `.pth`, which brings back `distutils`, only from site-packages, but a
# `sitecustomize` from PYTHONPATH too.
printf 'import _distutils_hack\n_distutils_hack.add_shim()\n' > $DEST$PREFIX/site/sitecustomize.py
'''

# The scanner and compiler, without descriptions of their own, which need glib's first.
[[package]]
id = "gobject-introspection"
version = "1.84.0"
scope = "runtime"
# Whole: the scanner names its prefix's `lib` and finds its Python module under it, which a split
# would point at the part with the libraries alone.
whole = true
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "setuptools", "bison-final", "m4-final", "flex", "glib",
  "libffi",
]
sources = [{ url = "https://download.gnome.org/sources/gobject-introspection/{series}/gobject-introspection-{version}.tar.xz" }]
smoke = ["bin/g-ir-compiler --version"]
probes = ["gobject-introspection-1.0"]

[package.meson]
env = { PYTHONPATH = "$LAB_DEP_setuptools/site" }
args = ["-D build_introspection_data=false", "-D doctool=disabled", "-D tests=false"]

# GLib, GObject, Gio and GModule.
[[package]]
id = "glib-gir"
version = "2.84.4"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "python3", "pkgconf", "zlib", "pcre2", "libffi", "util-linux", "gettext",
  "gobject-introspection", "setuptools",
]
sources = [{ url = "https://download.gnome.org/sources/glib/{series}/glib-{version}.tar.xz" }]

[package.meson]
env = { PYTHONPATH = "$LAB_DEP_setuptools/site" }
args = [
  "-D tests=false", "-D introspection=enabled", "-D man-pages=disabled", "-D selinux=disabled",
  "-D xattr=false",
]
keep = ["share/gir-1.0", "lib/girepository-1.0"]

# cairo, freetype2, fontconfig and the rest gobject-introspection describes itself.
[[package]]
id = "gobject-introspection-gir"
version = "1.84.0"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "setuptools", "bison-final", "m4-final", "flex", "glib",
  "libffi", "cairo", "glib-gir",
]
sources = [{ url = "https://download.gnome.org/sources/gobject-introspection/{series}/gobject-introspection-{version}.tar.xz" }]

[package.meson]
env = { PYTHONPATH = "$LAB_DEP_setuptools/site" }
args = [
  "-D build_introspection_data=true", "-D cairo=enabled", "-D doctool=disabled", "-D tests=false",
]
keep = ["share/gir-1.0", "lib/girepository-1.0"]
# The schema for `.gir` files is gobject-introspection's own.
install = "rm $DEST$PREFIX/share/gir-1.0/gir-1.2.rnc\n"

# HarfBuzz's description of itself and its GObject library.
[[package]]
id = "harfbuzz-gir"
version = "15.1.0"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "freetype", "glib", "gobject-introspection",
  "setuptools", "glib-gir", "gobject-introspection-gir",
]
sources = [{ url = "https://github.com/harfbuzz/harfbuzz/releases/download/{version}/harfbuzz-{version}.tar.xz" }]

[package.meson]
env = { PYTHONPATH = "$LAB_DEP_setuptools/site" }
args = [
  "-D freetype=enabled", "-D glib=enabled", "-D gobject=enabled", "-D cairo=disabled",
  "-D icu=disabled", "-D chafa=disabled", "-D introspection=enabled", "-D tests=disabled",
  "-D docs=disabled", "-D utilities=disabled",
]
keep = ["share/gir-1.0", "lib/girepository-1.0"]

[[package]]
id = "gdk-pixbuf-gir"
version = "2.44.8"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "glib", "libpng", "gobject-introspection",
  "setuptools", "glib-gir",
]
sources = [{ url = "https://download.gnome.org/sources/gdk-pixbuf/{series}/gdk-pixbuf-{version}.tar.xz" }]

[package.meson]
env = { PYTHONPATH = "$LAB_DEP_setuptools/site" }
args = [
  "-D png=enabled", "-D jpeg=disabled", "-D tiff=disabled", "-D gif=disabled",
  "-D others=disabled", "-D glycin=disabled", "-D builtin_loaders=png",
  "-D introspection=enabled", "-D documentation=false", "-D man=false", "-D tests=false",
  "-D installed_tests=false", "-D thumbnailer=disabled", "-D gio_sniffing=false",
]
keep = ["share/gir-1.0", "lib/girepository-1.0"]

[[package]]
id = "graphene-gir"
version = "1.10.8"
scope = "runtime"
core = true
extra_deps = ["python3", "glib", "gobject-introspection", "setuptools", "glib-gir"]
sources = [{ url = "https://download.gnome.org/sources/graphene/{series}/graphene-{version}.tar.xz" }]

[package.meson]
env = { PYTHONPATH = "$LAB_DEP_setuptools/site" }
args = ["-D tests=false", "-D installed_tests=false", "-D introspection=enabled"]
keep = ["share/gir-1.0", "lib/girepository-1.0"]

[[package]]
id = "pango-gir"
version = "1.56.4"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "harfbuzz", "fribidi", "cairo",
  "gobject-introspection", "setuptools", "glib-gir", "gobject-introspection-gir",
  "harfbuzz-gir",
]
sources = [{ url = "https://download.gnome.org/sources/pango/{series}/pango-{version}.tar.xz" }]

[package.meson]
env = { PYTHONPATH = "$LAB_DEP_setuptools/site" }
args = [
  "-D introspection=enabled", "-D documentation=false", "-D build-testsuite=false",
  "-D build-examples=false", "-D libthai=disabled", "-D xft=disabled", "-D cairo=enabled",
  "-D fontconfig=enabled", "-D freetype=enabled",
]
keep = ["share/gir-1.0", "lib/girepository-1.0"]

# Gtk, Gdk and Gsk.
[[package]]
id = "gtk4-gir"
version = "4.22.5"
scope = "runtime"
core = true
extra_deps = [
  "python3", "pango", "gdk-pixbuf", "libepoxy", "graphene", "libpng", "libjpeg-turbo",
  "shared-mime-info", "libtiff", "wayland", "wayland-protocols", "libxkbcommon", "libdrm",
  "mesa", "gettext", "gobject-introspection", "setuptools", "glib-gir",
  "gobject-introspection-gir", "harfbuzz-gir", "pango-gir", "gdk-pixbuf-gir", "graphene-gir",
]
sources = [{ url = "https://download.gnome.org/sources/gtk/{series}/gtk-{version}.tar.xz" }]

[package.meson]
env = { PYTHONPATH = "$LAB_DEP_setuptools/site" }
args = [
  "-D x11-backend=false", "-D wayland-backend=true", "-D broadway-backend=false",
  "-D media-gstreamer=disabled", "-D print-cups=disabled", "-D print-cpdb=disabled",
  "-D vulkan=disabled", "-D cloudproviders=disabled", "-D sysprof=disabled",
  "-D tracker=disabled", "-D colord=disabled", "-D accesskit=disabled",
  "-D introspection=enabled", "-D documentation=false", "-D man-pages=false",
  "-D build-demos=false", "-D build-testsuite=false", "-D build-examples=false",
  "-D build-tests=false",
]
keep = ["share/gir-1.0", "lib/girepository-1.0"]

# GObject libraries from Python, through their typelibs: what blueprint-compiler reads them with.
[[package]]
id = "pygobject"
version = "3.54.5"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "python3", "glib", "libffi", "glib-gir"]
sources = [{ url = "https://download.gnome.org/sources/pygobject/{series}/pygobject-{version}.tar.gz" }]

[package.meson]
args = [
  "-D pycairo=disabled", "-D tests=false", "-D python.purelibdir=site",
  "-D python.platlibdir=site",
]

# GTK interfaces written in Blueprint, compiled to the `.ui` files GTK loads.
[[package]]
id = "blueprint-compiler"
version = "0.22.2"
scope = "runtime"
core = true
runtime_deps = ["pygobject", "glib-gir"]
extra_deps = ["meson", "ninja", "python3"]
sources = [{ url = "https://gitlab.gnome.org/GNOME/blueprint-compiler/-/archive/v{version}/blueprint-compiler-v{version}.tar.gz" }]

[package.meson]
args = ["-D python.purelibdir=site"]
