# From the seed to a final toolchain. `scope` says how a package is built:
#   boot     once for every arm, linked to the seed
#   tool     with --prefix=/usr in every arm, since it only runs inside views
#   runtime  the way the arm under test says

[[package]]
id = "wrapper"
scope = "boot"
wrap = false
deps = ["seed"]
files = ["lab-cc.c"]
script = '''
S=$LAB_SEED
gcc -O2 lab-cc.c -o lab-cc -Wl,--dynamic-linker=$S/lib/ld-linux-x86-64.so.2 -Wl,-rpath,$S/lib
mkdir -p $OUT/bin
cp lab-cc $OUT/bin/
for name in gcc g++ cc c++; do ln -s lab-cc $OUT/bin/$name; done
'''

[[package]]
id = "m4"
scope = "boot"
deps = ["wrapper", "seed"]
sources = [{ url = "https://ftp.gnu.org/gnu/m4/m4-1.4.20.tar.xz" }]
script = '''
./configure --prefix=$PREFIX
make -j$NPROC
make install DESTDIR=$DEST
'''

[[package]]
id = "bison"
scope = "boot"
deps = ["wrapper", "seed", "m4"]
sources = [{ url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz" }]
script = '''
M4=/usr/bin/m4 ./configure --prefix=$PREFIX --disable-nls
make -j$NPROC
make install DESTDIR=$DEST
'''

[[package]]
id = "python"
scope = "boot"
deps = ["wrapper", "seed"]
sources = [{ url = "https://www.python.org/ftp/python/3.13.7/Python-3.13.7.tar.xz" }]
script = '''
./configure --prefix=$PREFIX --without-ensurepip
make -j$NPROC
make install DESTDIR=$DEST
'''

[[package]]
id = "linux-headers"
scope = "boot"
deps = ["wrapper", "seed"]
sources = [{ url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.16.1.tar.xz" }]
script = '''
make -j$NPROC headers HOSTCC=gcc
find usr/include -type f ! -name '*.h' -delete
mkdir -p $OUT/include
cp -r usr/include/. $OUT/include/
'''

[[package]]
id = "binutils-stage1"
scope = "boot"
deps = ["wrapper", "seed"]
sources = [{ url = "https://ftp.gnu.org/gnu/binutils/binutils-2.45.tar.xz" }]
script = '''
mkdir ../b && cd ../b
../src/configure --prefix=$PREFIX --disable-nls --disable-werror --disable-gprofng \
    --enable-deterministic-archives MAKEINFO=true
make -j$NPROC MAKEINFO=true
make install DESTDIR=$DEST MAKEINFO=true
'''

[[package]]
id = "gcc-stage1"
scope = "boot"
deps = ["wrapper", "seed", "m4"]
sources = [
  { url = "https://ftp.gnu.org/gnu/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz" },
  { url = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz", into = "gmp" },
  { url = "https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz", into = "mpfr" },
  { url = "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz", into = "mpc" },
]
script = '''
sed -i '/m64=/s/lib64/lib/' gcc/config/i386/t-linux64
mkdir ../b && cd ../b
../src/configure --prefix=$PREFIX --libdir=$PREFIX/lib --disable-bootstrap --disable-multilib \
    --disable-nls --disable-libsanitizer --enable-languages=c,c++ MAKEINFO=true \
    LDFLAGS_FOR_TARGET="${LAB_LINK_FLAGS:-}"
make -j$NPROC MAKEINFO=true
make install DESTDIR=$DEST MAKEINFO=true
# gcc saves "fixed" copies of the libc headers it saw, which would hide the next libc's.
rm -f $DEST$PREFIX/lib/gcc/*/*/include-fixed/*.h
'''

[[package]]
id = "glibc"
scope = "runtime"
fixup = false
deps = [
  "wrapper",
  { id = "seed", skip = "binutils" },
  "binutils-stage1",
  "m4",
  "bison",
  "python",
  { id = "linux-headers", view = false },
]
sources = [{ url = "https://ftp.gnu.org/gnu/glibc/glibc-2.42.tar.xz" }]
script = '''
mkdir ../b && cd ../b
cat > configparms <<EOP
slibdir=$PREFIX/lib
rtlddir=$PREFIX/lib
sbindir=$PREFIX/bin
rootsbindir=$PREFIX/bin
EOP
CC=$LAB_REAL_BIN/gcc CXX=$LAB_REAL_BIN/g++ BUILD_CC=gcc MAKEINFO=true CFLAGS=-O2 CXXFLAGS=-O2 \
../src/configure --prefix=$PREFIX --libdir=$PREFIX/lib --libexecdir=$PREFIX/lib/glibc \
    --with-headers=$LAB_DEP_linux_headers/include --enable-kernel=5.4 --disable-werror \
    --disable-nscd --disable-profile --without-selinux --enable-stack-protector=strong \
    --sysconfdir=/etc
make -j$NPROC MAKEINFO=true
make install DESTDIR=$DEST install_root=$DEST MAKEINFO=true
'''

[[package]]
id = "binutils"
scope = "tool"
deps = [
  "wrapper",
  { id = "seed", skip = "compilers" },
  { id = "gcc-stage1", rpath = false },
  { id = "binutils-stage1", rpath = false },
  "glibc",
  "linux-headers",
]
sources = [{ url = "https://ftp.gnu.org/gnu/binutils/binutils-2.45.tar.xz" }]
script = '''
mkdir ../b && cd ../b
../src/configure --prefix=$PREFIX --disable-nls --disable-werror --disable-gprofng \
    --enable-deterministic-archives MAKEINFO=true CFLAGS=-O2 CXXFLAGS=-O2
make -j$NPROC MAKEINFO=true
make install DESTDIR=$DEST MAKEINFO=true
'''

[[package]]
id = "gcc"
scope = "tool"
deps = [
  "wrapper",
  { id = "seed", skip = "compilers" },
  "m4",
  { id = "gcc-stage1", rpath = false },
  { id = "binutils-stage1", rpath = false },
  "glibc",
  "linux-headers",
]
sources = [
  { url = "https://ftp.gnu.org/gnu/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz" },
  { url = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz", into = "gmp" },
  { url = "https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz", into = "mpfr" },
  { url = "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz", into = "mpc" },
]
script = '''
sed -i '/m64=/s/lib64/lib/' gcc/config/i386/t-linux64
mkdir ../b && cd ../b
../src/configure --prefix=$PREFIX --libdir=$PREFIX/lib --disable-bootstrap --disable-multilib \
    --disable-nls --disable-libsanitizer --enable-languages=c,c++ MAKEINFO=true \
    LDFLAGS_FOR_TARGET="${LAB_LINK_FLAGS:-}" \
    CFLAGS=-O2 CXXFLAGS=-O2 CFLAGS_FOR_TARGET=-O2 CXXFLAGS_FOR_TARGET=-O2 \
    LDFLAGS="-static-libstdc++ -static-libgcc"
make -j$NPROC MAKEINFO=true
make install DESTDIR=$DEST MAKEINFO=true
# gcc saves "fixed" copies of the libc headers it saw, which would hide the next libc's.
rm -f $DEST$PREFIX/lib/gcc/*/*/include-fixed/*.h
'''

[[package]]
id = "hello"
scope = "runtime"
deps = [
  "wrapper",
  { id = "seed", skip = "compilers" },
  "gcc",
  "binutils",
  "glibc",
  "linux-headers",
]
files = ["hello.c", "hello.cc"]
script = '''
mkdir -p $DEST$PREFIX/bin
gcc -O2 hello.c -o $DEST$PREFIX/bin/hello
g++ -O2 hello.cc -o $DEST$PREFIX/bin/hello-cxx
'''
