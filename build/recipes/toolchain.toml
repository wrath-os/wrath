# From the seed to a final toolchain. `scope` says how a package is built:
#   boot     once for every arm, linked to the seed
#   tool     with --prefix=/usr in every arm, since it only runs inside views
#   runtime  the way the arm under test says

[[package]]
id = "wrapper"
scope = "boot"
wrap = false
deps = ["seed"]
files = ["lab-cc.c"]
script = '''
S=$LAB_SEED
gcc -O2 lab-cc.c -o lab-cc -Wl,--dynamic-linker=$S/lib/ld-linux-x86-64.so.2 -Wl,-rpath,$S/lib
mkdir -p $OUT/bin
cp lab-cc $OUT/bin/
for name in gcc g++ cc c++; do ln -s lab-cc $OUT/bin/$name; done
'''

[[package]]
id = "m4"
version = "1.4.20"
scope = "boot"
deps = ["wrapper", "seed"]
sources = [{ url = "https://ftp.gnu.org/gnu/m4/m4-{version}.tar.xz" }]
script = '''
./configure --prefix=$PREFIX
make -j$NPROC
make install DESTDIR=$DEST
'''

[[package]]
id = "bison"
version = "3.8.2"
scope = "boot"
deps = ["wrapper", "seed", "m4"]
sources = [{ url = "https://ftp.gnu.org/gnu/bison/bison-{version}.tar.xz" }]
script = '''
M4=/usr/bin/m4 ./configure --prefix=$PREFIX --disable-nls
make -j$NPROC
make install DESTDIR=$DEST
'''

[[package]]
id = "python"
version = "3.13.7"
scope = "boot"
deps = ["wrapper", "seed"]
sources = [{ url = "https://www.python.org/ftp/python/{version}/Python-{version}.tar.xz" }]
script = '''
./configure --prefix=$PREFIX --without-ensurepip
make -j$NPROC
make install DESTDIR=$DEST
'''

[[package]]
id = "linux-headers"
version = "6.16.1"
scope = "boot"
deps = ["wrapper", "seed"]
sources = [{ url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-{version}.tar.xz" }]
script = '''
make -j$NPROC headers HOSTCC=gcc
find usr/include -type f ! -name '*.h' -delete
mkdir -p $OUT/include
cp -r usr/include/. $OUT/include/
'''

[[package]]
id = "binutils-stage1"
version = "2.45"
scope = "boot"
deps = ["wrapper", "seed"]
sources = [{ url = "https://ftp.gnu.org/gnu/binutils/binutils-{version}.tar.xz" }]
script = '''
mkdir ../b && cd ../b
../src/configure --prefix=$PREFIX --disable-nls --disable-werror --disable-gprofng \
    --enable-deterministic-archives MAKEINFO=true
make -j$NPROC MAKEINFO=true
make install DESTDIR=$DEST MAKEINFO=true
'''

[[package]]
id = "gcc-stage1"
version = "15.2.0"
scope = "boot"
deps = ["wrapper", "seed", "m4"]
sources = [
  { url = "https://ftp.gnu.org/gnu/gcc/gcc-{version}/gcc-{version}.tar.xz" },
  { url = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz", into = "gmp" },
  { url = "https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz", into = "mpfr" },
  { url = "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz", into = "mpc" },
]
script = '''
sed -i '/m64=/s/lib64/lib/' gcc/config/i386/t-linux64
mkdir ../b && cd ../b
../src/configure --prefix=$PREFIX --libdir=$PREFIX/lib --disable-bootstrap --disable-multilib \
    --disable-nls --disable-libsanitizer --enable-languages=c,c++ MAKEINFO=true \
    LDFLAGS_FOR_TARGET="${LAB_LINK_FLAGS:-}"
make -j$NPROC MAKEINFO=true
make install DESTDIR=$DEST MAKEINFO=true
# gcc saves "fixed" copies of the libc headers it saw, which would hide the next libc's.
rm -f $DEST$PREFIX/lib/gcc/*/*/include-fixed/*.h
'''

[[package]]
id = "glibc"
version = "2.42"
scope = "runtime"
fixup = false
deps = [
  "wrapper",
  { id = "seed", skip = "binutils" },
  "binutils-stage1",
  "m4",
  "bison",
  "python",
  { id = "linux-headers", view = false },
]
sources = [{ url = "https://ftp.gnu.org/gnu/glibc/glibc-{version}.tar.xz" }]
files = ["glibc-nss-in-system.patch"]
script = '''
# NSS modules from other packages, such as systemd's, are found in the running system's lib/nss.
patch -p1 < glibc-nss-in-system.patch
mkdir ../b && cd ../b
cat > configparms <<EOP
slibdir=$PREFIX/lib
rtlddir=$PREFIX/lib
sbindir=$PREFIX/bin
rootsbindir=$PREFIX/bin
# The loader checks trusted directories with a memcmp the compiler would turn into pieces of the
# path in immediates, which nothing can rewrite once the package moves to its address.
CFLAGS-dl-load.c += -fno-builtin-memcmp
EOP
CC=$LAB_REAL_BIN/gcc CXX=$LAB_REAL_BIN/g++ BUILD_CC=gcc MAKEINFO=true CFLAGS=-O2 CXXFLAGS=-O2 \
../src/configure --prefix=$PREFIX --libdir=$PREFIX/lib --libexecdir=$PREFIX/lib/glibc \
    --with-headers=$LAB_DEP_linux_headers/include --enable-kernel=5.4 --disable-werror \
    --disable-nscd --disable-profile --without-selinux --enable-stack-protector=strong \
    --sysconfdir=/etc
make -j$NPROC MAKEINFO=true
make install DESTDIR=$DEST install_root=$DEST MAKEINFO=true
# ldd, tzselect and the like are bash scripts; a system finds bash on its PATH.
for script in $DEST$PREFIX/bin/*; do
    if head -c 32 "$script" | grep -q '^#! */bin/bash'; then
        sed -i '1s|^#! */bin/bash|#!/usr/bin/env bash|' "$script"
    fi
done
# ldd looks for the loader where x86 distributions keep it, lib64, whatever rtlddir says.
loader=$(cd $DEST$PREFIX/lib && ls ld-linux*.so.*)
sed -i "s|^RTLDLIST=.*|RTLDLIST=\"$PREFIX/lib/$loader\"|" $DEST$PREFIX/bin/ldd
grep -qx "RTLDLIST=\"$PREFIX/lib/$loader\"" $DEST$PREFIX/bin/ldd
'''

[[package]]
id = "binutils"
version = "2.45"
scope = "tool"
deps = [
  "wrapper",
  { id = "seed", skip = "compilers" },
  { id = "gcc-stage1", rpath = false },
  { id = "binutils-stage1", rpath = false },
  "glibc",
  "linux-headers",
]
sources = [{ url = "https://ftp.gnu.org/gnu/binutils/binutils-{version}.tar.xz" }]
script = '''
mkdir ../b && cd ../b
../src/configure --prefix=$PREFIX --disable-nls --disable-werror --disable-gprofng \
    --enable-deterministic-archives MAKEINFO=true CFLAGS=-O2 CXXFLAGS=-O2
make -j$NPROC MAKEINFO=true
make install DESTDIR=$DEST MAKEINFO=true
'''

[[package]]
id = "gcc"
version = "15.2.0"
scope = "tool"
deps = [
  "wrapper",
  { id = "seed", skip = "compilers" },
  "m4",
  { id = "gcc-stage1", rpath = false },
  { id = "binutils-stage1", rpath = false },
  "glibc",
  "linux-headers",
]
sources = [
  { url = "https://ftp.gnu.org/gnu/gcc/gcc-{version}/gcc-{version}.tar.xz" },
  { url = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz", into = "gmp" },
  { url = "https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz", into = "mpfr" },
  { url = "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz", into = "mpc" },
]
script = '''
sed -i '/m64=/s/lib64/lib/' gcc/config/i386/t-linux64
mkdir ../b && cd ../b
# What it compiles is position-independent with a stack protector unless asked otherwise, as
# other distributions build theirs.
../src/configure --prefix=$PREFIX --libdir=$PREFIX/lib --disable-bootstrap --disable-multilib \
    --disable-nls --disable-libsanitizer --enable-languages=c,c++ MAKEINFO=true \
    --enable-default-pie --enable-default-ssp \
    LDFLAGS_FOR_TARGET="${LAB_LINK_FLAGS:-}" \
    CFLAGS=-O2 CXXFLAGS=-O2 CFLAGS_FOR_TARGET=-O2 CXXFLAGS_FOR_TARGET=-O2 \
    LDFLAGS="-static-libstdc++ -static-libgcc"
make -j$NPROC MAKEINFO=true
make install DESTDIR=$DEST MAKEINFO=true
# gcc saves "fixed" copies of the libc headers it saw, which would hide the next libc's.
rm -f $DEST$PREFIX/lib/gcc/*/*/include-fixed/*.h
'''

[[package]]
id = "hello"
scope = "runtime"
deps = [
  "wrapper",
  { id = "seed", skip = "compilers" },
  "gcc",
  "binutils",
  "glibc",
  "linux-headers",
]
files = ["hello.c", "hello.cc"]
script = '''
mkdir -p $DEST$PREFIX/bin
gcc -O2 hello.c -o $DEST$PREFIX/bin/hello
g++ -O2 hello.cc -o $DEST$PREFIX/bin/hello-cxx
'''
