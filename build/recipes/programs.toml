# Programs people run, beyond what a system needs to boot and serve: small tools, an editor, and
# what runs a project's services.

[[package]]
id = "gnu-hello"
version = "2.12.2"
scope = "runtime"
core = true
sources = [{ url = "https://ftp.gnu.org/gnu/hello/hello-{version}.tar.gz" }]
smoke = ["bin/hello --version"]

[package.autotools]
args = ["--disable-nls"]

[[package]]
id = "nano"
version = "8.4"
scope = "runtime"
core = true
deps = ["ncurses"]
sources = [{ url = "https://www.nano-editor.org/dist/v8/nano-{version}.tar.xz" }]
smoke = ["bin/nano --version"]

[package.options.enableTiny]
type = "bool"
default = false
doc = "Leave out everything but editing, for rescue systems."

[package.autotools]
args = ["--disable-nls", "$tiny"]
prepare = '''
tiny=
if [ "$OPTION_enableTiny" = true ]; then
    tiny=--enable-tiny
fi
'''

[[package]]
id = "jq"
version = "1.8.1"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/jqlang/jq/releases/download/jq-{version}/jq-{version}.tar.gz" }]
smoke = ["bin/jq --version", "echo '{\"a\":1}' | bin/jq -e .a"]

# The release carries oniguruma, the regular expression library, and builds it in.
[package.autotools]
args = ["--with-oniguruma=builtin", "--disable-docs", "--disable-static"]

[[package]]
id = "process-compose"
version = "1.75.1"
scope = "runtime"
core = true
extra_deps = ["go"]
sources = [{ url = "https://github.com/F1bonacc1/process-compose/archive/v{version}/process-compose-{version}.tar.gz" }]
smoke = ["bin/process-compose version"]

[package.go]
packages = ["./src"]
ldflags = "-X github.com/f1bonacc1/process-compose/src/config.Version=v1.75.1"
install = '''
mv $DEST$PREFIX/bin/src $DEST$PREFIX/bin/process-compose
'''

[[package]]
id = "curl"
version = "8.15.0"
scope = "runtime"
core = true
extra_deps = ["openssl", "zlib", "perl"]
sources = [{ url = "https://curl.se/download/curl-{version}.tar.xz" }]
smoke = ["bin/curl --version"]

# Certificates come from the system's bundle, which the system puts in /etc/ssl.
[package.autotools]
args = [
    "--with-openssl", "--with-zlib", "--without-libpsl", "--disable-static",
    "--with-ca-bundle=/etc/ssl/certs/ca-certificates.crt", "--disable-manual",
]

[[package]]
id = "git"
version = "2.51.0"
scope = "runtime"
core = true
extra_deps = ["openssl", "zlib", "curl", "expat", "pcre2", "perl"]
sources = [{ url = "https://www.kernel.org/pub/software/scm/git/git-{version}.tar.xz" }]
script = '''
# Without the Tcl, Perl and Python parts: gitk, git gui, send-email and p4.
make -j$NPROC prefix=$PREFIX NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1 NO_GETTEXT=1 USE_LIBPCRE2=1 \
    INSTALL_SYMLINKS=1 all
make prefix=$PREFIX NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1 NO_GETTEXT=1 USE_LIBPCRE2=1 \
    INSTALL_SYMLINKS=1 DESTDIR=$DEST install
'''
smoke = ["bin/git --version", "sh: cd /tmp && $OUT/bin/git init -q x && $OUT/bin/git -C x status"]

[[package]]
id = "wget"
version = "1.25.0"
scope = "runtime"
core = true
extra_deps = ["openssl", "zlib", "pkgconf", "perl"]
sources = [{ url = "https://ftp.gnu.org/gnu/wget/wget-{version}.tar.gz" }]
smoke = ["bin/wget --version"]

[package.autotools]
args = [
    "--with-ssl=openssl", "--without-libpsl", "--disable-nls", "--disable-pcre",
    "--disable-pcre2", "--disable-iri",
]
install = '''
# Certificates come from the system's bundle, as for curl.
echo "ca_certificate = /etc/ssl/certs/ca-certificates.crt" >> $DEST$PREFIX/etc/wgetrc
'''

[[package]]
id = "hostname"
version = "3.25"
scope = "runtime"
core = true
sources = [{ url = "https://deb.debian.org/debian/pool/main/h/hostname/hostname_{version}.tar.xz" }]
script = '''
# The small `hostname` program Debian keeps, which prints or sets the machine's name.
make -j$NPROC CFLAGS="-O2"
install -Dm755 hostname $DEST$PREFIX/bin/hostname
'''
smoke = ["bin/hostname --version"]

[[package]]
id = "bubblewrap"
version = "0.11.0"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "libcap"]
sources = [{ url = "https://github.com/containers/bubblewrap/releases/download/v{version}/bubblewrap-{version}.tar.xz" }]
smoke = ["bin/bwrap --version"]

# The sandbox every build runs in, and `run` and `shell` in a checkout.
[package.meson]
args = ["-D man=disabled", "-D selinux=disabled", "-D tests=false"]

[[package]]
id = "foreign-hello"
version = "1"
scope = "runtime"
core = true
wrap = false
fixup = false
files = ["foreign-hello.cc"]
script = '''
# For tests of running programs built elsewhere: no run path, and the usual loader.
mkdir -p $DEST$PREFIX/bin
g++ -O2 foreign-hello.cc -o $DEST$PREFIX/bin/foreign-hello \
    -Wl,--dynamic-linker=/lib64/ld-linux-x86-64.so.2
'''
