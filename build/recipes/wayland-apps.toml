# Programs for a Wayland desktop that other systems install most: a terminal, screenshots, the
# clipboard, wallpaper, idling and locking, and the libraries they need.

# Libraries.

[[package]]
id = "libjpeg-turbo"
version = "3.2.1"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/{version}/libjpeg-turbo-{version}.tar.gz" }]
probes = ["libjpeg", "libturbojpeg"]

[package.cmake]
args = ["-D ENABLE_STATIC=OFF", "-D CMAKE_INSTALL_LIBDIR=lib"]

[[package]]
id = "libscfg"
version = "0.1.1"
scope = "runtime"
core = true
sources = [{ url = "https://git.sr.ht/~emersion/libscfg/archive/v{version}.tar.gz" }]
probes = ["scfg"]

# The configuration format kanshi reads.
[package.meson]

[[package]]
id = "libnotify"
version = "0.8.9"
scope = "runtime"
core = true
extra_deps = ["gdk-pixbuf"]
sources = [{ url = "https://download.gnome.org/sources/libnotify/{series}/libnotify-{version}.tar.xz" }]
probes = ["libnotify"]
smoke = ["bin/notify-send --version"]

# Desktop notifications, and notify-send to show one from a shell.
[package.meson]
args = [
  "-D tests=false", "-D introspection=disabled", "-D man=false", "-D gtk_doc=false",
  "-D docbook_docs=disabled",
]

# Programs.

[[package]]
id = "foot"
version = "1.28.0"
scope = "runtime"
core = true
extra_deps = ["fcft", "libxkbcommon", "wayland", "wayland-protocols"]
sources = [{ url = "https://codeberg.org/dnkl/foot/archive/{version}.tar.gz" }]
smoke = ["bin/foot --version"]

# The terminal. Its terminfo entry is ncurses' own.
[package.meson]
args = [
  "-D docs=disabled", "-D tests=false", "-D grapheme-clustering=disabled",
  "-D terminfo=disabled", "-D utmp-backend=none",
]

[[package]]
id = "grim"
version = "1.5.0"
scope = "runtime"
core = true
extra_deps = ["pixman", "libpng", "libjpeg-turbo", "wayland", "wayland-protocols"]
sources = [{ url = "https://gitlab.freedesktop.org/emersion/grim/-/archive/v{version}/grim-v{version}.tar.gz" }]
smoke = ["bin/grim -h"]

# Screenshots, of the whole screen or of the region slurp picks.
[package.meson]
args = ["-D jpeg=enabled", "-D man-pages=disabled"]

[[package]]
id = "slurp"
version = "1.5.0"
scope = "runtime"
core = true
extra_deps = ["cairo", "libxkbcommon", "wayland", "wayland-protocols"]
sources = [{ url = "https://github.com/emersion/slurp/releases/download/v{version}/slurp-{version}.tar.gz" }]
smoke = ["bin/slurp -h"]

[package.meson]
args = ["-D man-pages=disabled"]

[[package]]
id = "wl-clipboard"
version = "2.3.0"
scope = "runtime"
core = true
extra_deps = ["wayland", "wayland-protocols"]
sources = [{ url = "https://github.com/bugaevc/wl-clipboard/archive/v{version}/wl-clipboard-{version}.tar.gz" }]
smoke = ["bin/wl-copy --version", "bin/wl-paste --version"]

[package.meson]
args = ["-D fishcompletiondir=share/fish/vendor_completions.d"]

[[package]]
id = "cliphist"
version = "0.7.0"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/sentriz/cliphist/archive/v{version}/cliphist-{version}.tar.gz" }]
smoke = ["bin/cliphist version"]

# The clipboard's history, kept from what wl-paste hands it.
[package.go]

[[package]]
id = "swaybg"
version = "1.2.2"
scope = "runtime"
core = true
extra_deps = ["cairo", "gdk-pixbuf", "wayland", "wayland-protocols"]
sources = [{ url = "https://github.com/swaywm/swaybg/releases/download/v{version}/swaybg-{version}.tar.gz" }]
smoke = ["bin/swaybg -v"]

# Wallpaper.
[package.meson]
args = ["-D man-pages=disabled", "-D gdk-pixbuf=enabled"]

[[package]]
id = "swayidle"
version = "1.9.1"
scope = "runtime"
core = true
extra_deps = ["wayland", "wayland-protocols", "systemd"]
sources = [{ url = "https://github.com/swaywm/swayidle/releases/download/v{version}/swayidle-{version}.tar.gz" }]
# It prints its help and exits with 1.
smoke = ["bin/swayidle -h 2>&1 | grep -q Usage"]

# Runs a command when the seat has been idle a while, and before it sleeps.
[package.meson]
args = ["-D man-pages=disabled", "-D logind=enabled", "-D logind-provider=systemd"]

[[package]]
id = "swaylock"
version = "1.8.6"
scope = "runtime"
core = true
extra_deps = ["cairo", "gdk-pixbuf", "libxkbcommon", "wayland", "wayland-protocols", "linux-pam"]
sources = [{ url = "https://github.com/swaywm/swaylock/releases/download/v{version}/swaylock-{version}.tar.gz" }]
smoke = ["bin/swaylock -v"]

# The screen locker. It checks the password with PAM, as its service in /etc/pam.d says.
[package.meson]
args = ["-D man-pages=disabled", "-D pam=enabled", "-D gdk-pixbuf=enabled"]

[[package]]
id = "wlsunset"
version = "0.4.0"
scope = "runtime"
core = true
extra_deps = ["wayland", "wayland-protocols"]
sources = [{ url = "https://git.sr.ht/~kennylevinsen/wlsunset/archive/{version}.tar.gz" }]
smoke = ["bin/wlsunset -h"]

# Warmer colours after sunset.
[package.meson]
args = ["-D man-pages=disabled"]

[[package]]
id = "kanshi"
version = "1.7.0"
scope = "runtime"
core = true
extra_deps = ["wayland", "libscfg"]
sources = [{ url = "https://git.sr.ht/~emersion/kanshi/archive/v{version}.tar.gz" }]
smoke = ["bin/kanshi -h"]

# Picks the monitor layout for the monitors plugged in.
[package.meson]
args = ["-D man-pages=disabled", "-D ipc=disabled"]

[[package]]
id = "brightnessctl"
version = "0.5.1"
scope = "runtime"
core = true
extra_deps = ["pkgconf", "systemd"]
sources = [{ url = "https://github.com/Hummer12007/brightnessctl/archive/{version}/brightnessctl-{version}.tar.gz" }]
smoke = ["bin/brightnessctl --version"]
# The screen's and keyboard's backlight, set through logind so no group or setuid is needed.
script = '''
make -j$NPROC ENABLE_SYSTEMD=1 PREFIX=$PREFIX
make install ENABLE_SYSTEMD=1 PREFIX=$PREFIX DESTDIR=$DEST INSTALL_UDEV_RULES=0
'''

[[package]]
id = "playerctl"
version = "2.4.1"
scope = "runtime"
core = true
extra_deps = ["glib"]
sources = [{ url = "https://github.com/altdesktop/playerctl/archive/v{version}/playerctl-{version}.tar.gz" }]
smoke = ["bin/playerctl --version"]

# Plays, pauses and skips in whichever media player is running.
[package.meson]
args = ["-D gtk-doc=false", "-D introspection=false", "-D bash-completions=false"]
