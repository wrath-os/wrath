# What the `native-web` configuration of wrath asks for.

[[package]]
id = "libmnl"
version = "1.0.5"
scope = "runtime"
core = true
sources = [{ url = "https://www.netfilter.org/pub/libmnl/libmnl-{version}.tar.bz2" }]

[package.autotools]
args = ["--disable-static"]

[[package]]
id = "libnftnl"
version = "1.2.9"
scope = "runtime"
core = true
extra_deps = ["libmnl", "pkgconf"]
sources = [{ url = "https://www.netfilter.org/pub/libnftnl/libnftnl-{version}.tar.xz" }]

[package.autotools]
args = ["--disable-static"]

[[package]]
id = "nftables"
version = "1.1.3"
scope = "runtime"
core = true
extra_deps = ["libnftnl", "pkgconf"]
sources = [{ url = "https://www.netfilter.org/pub/nftables/nftables-{version}.tar.xz" }]
smoke = ["bin/nft --version"]

[package.autotools]
args = [
    "--sbindir=$PREFIX/bin", "--disable-static", "--disable-man-doc", "--with-mini-gmp",
    "--without-cli", "--without-xtables", "--with-json=no",
]

[[package]]
id = "nginx"
version = "1.28.0"
scope = "runtime"
core = true
extra_deps = ["pcre2", "zlib"]
sources = [{ url = "https://nginx.org/download/nginx-{version}.tar.gz" }]
smoke = ["bin/nginx -v"]

# The store is read-only, so everything nginx writes on its own goes under its runtime directory.
[package.autotools]
args = [
    "--sbin-path=$PREFIX/bin/nginx", "--error-log-path=stderr", "--user=nobody",
    "--group=nogroup", "--http-log-path=/var/log/nginx/access.log", "--pid-path=/run/nginx.pid",
    "--lock-path=/run/nginx.lock",
    "--http-client-body-temp-path=/run/nginx-main/client_body",
    "--http-proxy-temp-path=/run/nginx-main/proxy",
    "--http-fastcgi-temp-path=/run/nginx-main/fastcgi",
    "--http-uwsgi-temp-path=/run/nginx-main/uwsgi",
    "--http-scgi-temp-path=/run/nginx-main/scgi",
]
