# Firmware the kernel loads into devices, and CPU microcode, which goes at the very start of the
# initrd for the CPU to read before anything else runs.

[[package]]
id = "linux-firmware"
version = "20250917"
scope = "runtime"
core = true
whole = true
extra_deps = ["zstd"]
sources = [{ url = "https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-{version}.tar.xz" }]
script = '''
# Every file the project lists, compressed, with the links it makes between them.
./copy-firmware.sh --zstd $DEST$PREFIX/lib/firmware
'''

[[package]]
id = "microcode-amd"
version = "20250917"
scope = "runtime"
core = true
whole = true
sources = [{ url = "https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-{version}.tar.xz" }]
script = '''
# The name and place the kernel reads microcode from in the initrd.
mkdir -p $DEST$PREFIX/kernel/x86/microcode
cat amd-ucode/microcode_amd*.bin > $DEST$PREFIX/kernel/x86/microcode/AuthenticAMD.bin
'''

[[package]]
id = "zd1211fw"
version = "1.5"
scope = "runtime"
core = true
whole = true
sources = [{ url = "https://downloads.sourceforge.net/project/zd1211/zd1211-firmware/{version}/zd1211-firmware-{version}.tar.bz2" }]
script = '''
mkdir -p $DEST$PREFIX/lib/firmware/zd1211
cp zd1211_* zd1211b_* $DEST$PREFIX/lib/firmware/zd1211/
'''
