# What installing onto encrypted disks needs: device-mapper and cryptsetup to unlock them,
# btrfs-progs for subvolumes, and what those use.

[[package]]
id = "markupsafe"
version = "3.0.2"
scope = "runtime"
core = true
sources = [{ url = "https://files.pythonhosted.org/packages/source/m/markupsafe/markupsafe-{version}.tar.gz" }]
script = '''
mkdir -p $DEST$PREFIX/site
cp -r src/markupsafe $DEST$PREFIX/site/
'''

[[package]]
id = "jinja2"
version = "3.1.6"
scope = "runtime"
core = true
sources = [{ url = "https://files.pythonhosted.org/packages/source/j/jinja2/jinja2-{version}.tar.gz" }]
script = '''
mkdir -p $DEST$PREFIX/site
cp -r src/jinja2 $DEST$PREFIX/site/
'''

[[package]]
id = "pyelftools"
version = "0.32"
scope = "runtime"
core = true
sources = [{ url = "https://files.pythonhosted.org/packages/source/p/pyelftools/pyelftools-{version}.tar.gz" }]
script = '''
mkdir -p $DEST$PREFIX/site
cp -r elftools $DEST$PREFIX/site/
'''

[[package]]
id = "json-c"
version = "0.18"
scope = "runtime"
core = true
extra_deps = ["cmake", "ninja"]
sources = [{ url = "https://s3.amazonaws.com/json-c_releases/releases/json-c-{version}.tar.gz" }]
probes = ["json-c"]

[package.cmake]
args = [
    "-DBUILD_STATIC_LIBS=OFF", "-DDISABLE_WERROR=ON", "-DBUILD_APPS=OFF",
    "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
]

[[package]]
id = "popt"
version = "1.19"
scope = "runtime"
core = true
sources = [{ url = "http://ftp.rpm.org/popt/releases/popt-1.x/popt-{version}.tar.gz" }]
probes = ["popt"]

[package.autotools]
args = ["--disable-static", "--disable-nls"]

[[package]]
id = "libudev"
version = "257.8"
scope = "runtime"
core = true
extra_deps = [
    "meson", "ninja", "python3", "markupsafe", "jinja2", "pyelftools", "pkgconf", "gperf", "libcap", "util-linux",
    "libxcrypt", "m4-final",
]
sources = [{ url = "https://github.com/systemd/systemd/archive/v{version}/systemd-{version}.tar.gz" }]
script = '''
# Only systemd's udev library, for device-mapper, which systemd itself builds on through cryptsetup.
export PYTHONPATH=$LAB_DEP_jinja2/site:$LAB_DEP_markupsafe/site:$LAB_DEP_pyelftools/site
meson setup /build/b --prefix=$PREFIX --libdir=lib --buildtype=release --auto-features=disabled \
    -D mode=release -D man=disabled -D html=disabled -D tests=false -D install-tests=false
# The library, named by its full version, and its pkg-config file, wherever meson puts them.
library=$(ninja -C /build/b -t targets all | awk -F: '$1 ~ /libudev\.so\.[0-9.]*[0-9]$/ { print $1; exit }')
pc=$(ninja -C /build/b -t targets all | awk -F: '$1 ~ /libudev\.pc$/ { print $1; exit }')
ninja -C /build/b -j$NPROC "$library" "$pc"
mkdir -p $DEST$PREFIX/lib/pkgconfig $DEST$PREFIX/include
cp "/build/b/$library" $DEST$PREFIX/lib/
ln -s "${library##*/}" $DEST$PREFIX/lib/libudev.so.1
ln -s libudev.so.1 $DEST$PREFIX/lib/libudev.so
cp "/build/b/$pc" $DEST$PREFIX/lib/pkgconfig/
cp src/libudev/libudev.h $DEST$PREFIX/include/
'''
probes = ["udev"]

[[package]]
id = "device-mapper"
version = "2.03.30"
scope = "runtime"
core = true
extra_deps = ["util-linux", "pkgconf", "libudev"]
sources = [{ url = "https://sourceware.org/pub/lvm2/LVM2.{version}.tgz" }]
script = '''
./configure --prefix=$PREFIX --sbindir=$PREFIX/bin --libdir=$PREFIX/lib --disable-static_link \
    --enable-pkgconfig --disable-selinux --disable-readline --enable-udev_sync \
    --with-udev-prefix=$PREFIX --with-systemdsystemunitdir=$PREFIX/lib/systemd/system \
    --with-default-dm-run-dir=/run --with-default-run-dir=/run/lvm --with-default-locking-dir=/run/lock/lvm
make -j$NPROC device-mapper
make install_device-mapper DESTDIR=$DEST
'''
smoke = ["bin/dmsetup --version"]
probes = ["devmapper"]

[[package]]
id = "cryptsetup"
version = "2.7.5"
scope = "runtime"
core = true
extra_deps = ["json-c", "popt", "device-mapper", "openssl", "util-linux", "pkgconf"]
sources = [{ url = "https://www.kernel.org/pub/linux/utils/cryptsetup/v2.7/cryptsetup-{version}.tar.xz" }]
smoke = ["bin/cryptsetup --version"]
probes = ["cryptsetup"]

[package.autotools]
args = [
    "--sbindir=$PREFIX/bin", "--disable-static", "--disable-nls", "--disable-asciidoc",
    "--disable-ssh-token", "--disable-selinux", "--with-crypto_backend=openssl",
    "--disable-internal-argon2", "--disable-libargon2",
    "--with-tmpfilesdir=$PREFIX/lib/tmpfiles.d",
]

[[package]]
id = "tpm2-tss"
version = "4.2.1"
scope = "runtime"
core = true
extra_deps = ["openssl", "pkgconf"]
sources = [{ url = "https://github.com/tpm2-software/tpm2-tss/releases/download/{version}/tpm2-tss-{version}.tar.gz" }]
probes = ["tss2-esys", "tss2-rc", "tss2-mu", "tss2-tcti-device"]

# The libraries systemd talks to the TPM through, to unlock disks with it. The feature API and
# policy library need a JSON parser and a web client, and systemd uses neither.
[package.autotools]
args = [
    "--disable-static", "--disable-fapi", "--disable-policy", "--disable-doxygen-doc",
    "--disable-unit", "--disable-integration", "--disable-tcti-libtpms",
    "--disable-tcti-spi-helper", "--disable-tcti-spi-ltt2go", "--disable-tcti-spi-ftdi",
    "--disable-tcti-i2c-helper", "--disable-tcti-i2c-ftdi",
    "--with-udevrulesdir=$PREFIX/lib/udev/rules.d", "--with-sysusersdir=$PREFIX/lib/sysusers.d",
    "--with-tmpfilesdir=$PREFIX/lib/tmpfiles.d", "--with-runstatedir=/run",
    "--sysconfdir=$PREFIX/etc",
]

[[package]]
id = "btrfs-progs"
version = "6.14"
scope = "runtime"
core = true
extra_deps = ["util-linux", "zlib", "zstd", "pkgconf"]
sources = [{ url = "https://www.kernel.org/pub/linux/kernel/people/kdave/btrfs-progs/btrfs-progs-v{version}.tar.xz" }]
smoke = ["bin/btrfs --version", "bin/mkfs.btrfs --version"]

[package.autotools]
args = [
    "--bindir=$PREFIX/bin", "--disable-documentation", "--disable-python", "--disable-convert",
    "--disable-zoned", "--disable-lzo", "--disable-libudev", "--disable-backtrace",
]

[[package]]
id = "dosfstools"
version = "4.2"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/dosfstools/dosfstools/releases/download/v{version}/dosfstools-{version}.tar.gz" }]
smoke = ["bin/mkfs.vfat --help"]

[package.autotools]
args = ["--sbindir=$PREFIX/bin", "--enable-compat-symlinks", "--without-udev"]
