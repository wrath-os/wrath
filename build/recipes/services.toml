# Services every system has beyond systemd and dbus: polkit, which decides what unprivileged
# programs may ask of privileged ones, and the network tools in the base system.

[[package]]
id = "duktape"
version = "2.7.0"
scope = "runtime"
core = true
sources = [{ url = "https://duktape.org/duktape-{version}.tar.xz" }]
script = '''
# A small JavaScript engine, which polkit runs its rules in.
make -f Makefile.sharedlibrary -j$NPROC INSTALL_PREFIX=$PREFIX
make -f Makefile.sharedlibrary install INSTALL_PREFIX=$DEST$PREFIX
sed -i "s#$DEST##g" $DEST$PREFIX/lib/pkgconfig/duktape.pc 2>/dev/null || true
'''
probes = ["duktape"]

[[package]]
id = "polkit"
version = "127"
scope = "runtime"
core = true
extra_deps = [
    "meson", "ninja", "pkgconf", "glib", "expat", "duktape", "linux-pam",
    "systemd", "gettext", "perl",
    "python3",
]
sources = [{ url = "https://github.com/polkit-org/polkit/archive/{version}/polkit-{version}.tar.gz" }]
smoke = ["bin/pkexec --version", "bin/pkaction --version"]

[package.meson]
args = [
    "--sysconfdir=/etc", "-D authfw=pam", "-D session_tracking=logind", "-D introspection=false",
    "-D man=false", "-D examples=false", "-D tests=false", "-D gtk_doc=false",
    "-D systemdsystemunitdir=$PREFIX/lib/systemd/system", "-D polkitd_user=polkitd",
    "-D privileged_group=wheel",
]
prepare = '''
# It asks systemd where sysusers and tmpfiles entries go, which is systemd's own store path.
sed -i "s#systemd_dep.get_variable(pkgconfig : 'sysusers_dir')#'$PREFIX/lib/sysusers.d'#; \
    s#systemd_dep.get_variable(pkgconfig : 'tmpfiles_dir')#'$PREFIX/lib/tmpfiles.d'#" meson.build
'''

[[package]]
id = "iputils"
version = "20250605"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "libcap"]
sources = [{ url = "https://github.com/iputils/iputils/archive/{version}/iputils-{version}.tar.gz" }]
smoke = ["bin/ping -V"]

[package.meson]
args = [
    "--sbindir=bin", "-D BUILD_MANS=false", "-D USE_IDN=false", "-D USE_GETTEXT=false",
    "-D SKIP_TESTS=true",
]

[[package]]
id = "locales"
scope = "runtime"
core = true
script = '''
# Each locale compiled into a directory of its own for glibc to find through LOCPATH.
mkdir -p $DEST$PREFIX/lib/locale
for entry in $OPTION_locales; do
    name=${entry%/*}
    charset=${entry#*/}
    input=${name%%.*}
    localedef --no-archive -i "${input%%@*}" -f "$charset" "$DEST$PREFIX/lib/locale/$name"
    test -s "$DEST$PREFIX/lib/locale/$name/LC_CTYPE"
done
'''

[package.options.locales]
type = "list"
default = ["C.UTF-8/UTF-8"]
doc = "The locales to build, each a name and its character set, such as `en_US.UTF-8/UTF-8`."

[[package]]
id = "tzdata"
version = "2026f"
scope = "runtime"
core = true
sources = [{ url = "https://data.iana.org/time-zones/releases/tzdata{version}.tar.gz" }]
smoke = ["test -s share/zoneinfo/Europe/Stockholm", "test -s share/zoneinfo/UTC"]
script = '''
# The time zones, compiled with glibc's zic, where /etc/localtime and TZ name them.
zic -d $DEST$PREFIX/share/zoneinfo \
    africa antarctica asia australasia europe northamerica southamerica etcetera backward
cp zone1970.tab iso3166.tab $DEST$PREFIX/share/zoneinfo/
'''

[[package]]
id = "zram-generator"
version = "1.2.1"
scope = "runtime"
core = true
extra_deps = ["rust-bin", "systemd"]
sources = [{ url = "https://github.com/systemd/zram-generator/archive/v{version}/zram-generator-{version}.tar.gz" }]
files = ["locks/zram-generator.Cargo.lock"]

# The project doesn't ship a lock, so one made once with `cargo generate-lockfile` is kept beside
# the recipes. Its Makefile installs the generator and its unit where systemd looks.
[package.cargo]
lock = "recipes/locks/zram-generator.Cargo.lock"
programs = []
install = '''
make install NOMAN=1 CARGOFLAGS="--offline --locked" DESTDIR=$DEST \
    SYSTEMD_UTIL_DIR=$SYSTEMD_UTIL_DIR \
    SYSTEMD_SYSTEM_UNIT_DIR=$SYSTEMD_SYSTEM_UNIT_DIR \
    SYSTEMD_SYSTEM_GENERATOR_DIR=$SYSTEMD_SYSTEM_GENERATOR_DIR
'''

[package.cargo.env]
SYSTEMD_UTIL_DIR = "$LAB_DEP_systemd/lib/systemd"
SYSTEMD_SYSTEM_UNIT_DIR = "$PREFIX/lib/systemd/system"
SYSTEMD_SYSTEM_GENERATOR_DIR = "$PREFIX/lib/systemd/system-generators"

[[package]]
id = "ca-certificates"
version = "2026-11-05"
scope = "runtime"
core = true
sources = [{ url = "https://curl.se/ca/cacert-{version}.pem", file = true, into = "cacert.pem" }]
script = '''
# The certificate authorities Mozilla trusts, as curl extracts them from Firefox.
install -Dm644 cacert.pem $DEST$PREFIX/share/ca-certificates/ca-certificates.crt
'''
smoke = ["sh: grep -q 'BEGIN CERTIFICATE' $OUT/share/ca-certificates/ca-certificates.crt"]
