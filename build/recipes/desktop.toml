  "meson", "ninja", "pkgconf", "python3",
  "gcr3", "libgcrypt", "systemd", "linux-pam", "gettext",
]
sources = [{ url = "https://download.gnome.org/sources/gnome-keyring/{series}/gnome-keyring-{version}.tar.xz" }]

# The secrets service, started in each user's session. Its PAM module unlocks it at login.
[package.meson]
