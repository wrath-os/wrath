# A graphical session: the kernel's display and input devices as libraries, Wayland, keymaps,
# seats, and the GPU drivers.

[[package]]
id = "libdrm"
version = "2.4.134"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf"]
sources = [{ url = "https://dri.freedesktop.org/libdrm/libdrm-{version}.tar.xz" }]
script = '''
# The kernel's display interface, with AMD's and Radeon's parts.
meson setup /build/b --prefix=$PREFIX --libdir=lib --buildtype=release -D amdgpu=enabled \
    -D radeon=enabled -D intel=disabled -D nouveau=disabled -D vmwgfx=disabled \
    -D valgrind=disabled -D man-pages=disabled -D tests=false -D cairo-tests=disabled
ninja -C /build/b -j$NPROC
DESTDIR=$DEST ninja -C /build/b install
'''
probes = ["libdrm"]

[[package]]
id = "wayland"
version = "1.26.0"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "libffi", "expat", "libxml2"]
sources = [{ url = "https://gitlab.freedesktop.org/wayland/wayland/-/releases/{version}/downloads/wayland-{version}.tar.xz" }]
script = '''
meson setup /build/b --prefix=$PREFIX --libdir=lib --buildtype=release -D documentation=false \
    -D tests=false -D dtd_validation=false
ninja -C /build/b -j$NPROC
DESTDIR=$DEST ninja -C /build/b install
'''
smoke = ["bin/wayland-scanner --version"]
probes = ["wayland-client"]

[[package]]
id = "wayland-protocols"
version = "1.50"
