# A graphical session: the kernel's display and input devices as libraries, Wayland, keymaps,
# seats, and the GPU drivers.

[[package]]
id = "libdrm"
version = "2.4.134"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf"]
sources = [{ url = "https://dri.freedesktop.org/libdrm/libdrm-{version}.tar.xz" }]
probes = ["libdrm"]

# The kernel's display interface, with AMD's and Radeon's parts.
[package.meson]
args = [
  "-D amdgpu=enabled", "-D radeon=enabled", "-D intel=disabled", "-D nouveau=disabled",
  "-D vmwgfx=disabled", "-D valgrind=disabled", "-D man-pages=disabled", "-D tests=false",
  "-D cairo-tests=disabled",
]

[[package]]
id = "wayland"
version = "1.26.0"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "libffi", "expat", "libxml2"]
sources = [{ url = "https://gitlab.freedesktop.org/wayland/wayland/-/releases/{version}/downloads/wayland-{version}.tar.xz" }]
smoke = ["bin/wayland-scanner --version"]
probes = ["wayland-client"]

[package.meson]
args = ["-D documentation=false", "-D tests=false", "-D dtd_validation=false"]

[[package]]
id = "wayland-protocols"
version = "1.50"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "wayland"]
sources = [{ url = "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/{version}/downloads/wayland-protocols-{version}.tar.xz" }]

[package.meson]
args = ["-D tests=false"]

[[package]]
id = "xkeyboard-config"
version = "2.48"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "python3", "gettext", "perl"]
sources = [{ url = "https://www.x.org/releases/individual/data/xkeyboard-config/xkeyboard-config-{version}.tar.xz" }]

# Keyboard layouts, which libxkbcommon reads.
[package.meson]

[[package]]
id = "libxkbcommon"
version = "1.13.2"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "bison-final", "m4-final", "xkeyboard-config", "libxml2"]
sources = [{ url = "https://github.com/xkbcommon/libxkbcommon/archive/xkbcommon-{version}/libxkbcommon-xkbcommon-{version}.tar.gz" }]
probes = ["xkbcommon"]

# Keymaps from keyboard layouts, read from xkeyboard-config where it is in the store.
[package.meson]
args = [
  "-D xkb-config-root=$LAB_DEP_xkeyboard_config/share/xkeyboard-config-2",
  "-D x-locale-root=/run/system/share/X11/locale",
  "-D enable-x11=false", "-D enable-wayland=false", "-D enable-docs=false",
  "-D enable-tools=false",
]

# Keymaps from an X server, for the few programs that always link X11, such as wezterm. Only its
# own library: the rest is libxkbcommon's, which it finds by name.
[[package]]
id = "libxkbcommon-x11"
version = "1.13.2"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "bison-final", "m4-final", "xkeyboard-config", "libxml2",
  "libxcb", "libxkbcommon",
]
sources = [{ url = "https://github.com/xkbcommon/libxkbcommon/archive/xkbcommon-{version}/libxkbcommon-xkbcommon-{version}.tar.gz" }]
probes = ["xkbcommon-x11"]

[package.meson]
args = [
  "-D xkb-config-root=$LAB_DEP_xkeyboard_config/share/xkeyboard-config-2",
  "-D x-locale-root=/run/system/share/X11/locale",
  "-D enable-x11=true", "-D enable-wayland=false", "-D enable-docs=false",
  "-D enable-tools=false",
]
install = '''
find $DEST$PREFIX ! -type d ! -name 'libxkbcommon-x11*' ! -name 'xkbcommon-x11.*' -delete
find $DEST$PREFIX -type d -empty -delete
'''

[[package]]
id = "pixman"
version = "0.46.4"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf"]
sources = [{ url = "https://cairographics.org/releases/pixman-{version}.tar.gz" }]
probes = ["pixman-1"]

[package.meson]
args = ["-D tests=disabled", "-D demos=disabled", "-D gtk=disabled", "-D libpng=disabled"]

[[package]]
id = "libevdev"
version = "1.14.0"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "python3"]
sources = [{ url = "https://www.freedesktop.org/software/libevdev/libevdev-{version}.tar.xz" }]
probes = ["libevdev"]

[package.meson]
args = ["-D tests=disabled", "-D documentation=disabled"]

[[package]]
id = "mtdev"
version = "1.1.7"
scope = "runtime"
core = true
sources = [{ url = "http://bitmath.org/code/mtdev/mtdev-{version}.tar.bz2" }]
probes = ["mtdev"]

[package.autotools]
args = ["--disable-static"]

[[package]]
id = "libinput"
version = "1.32.0"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "systemd", "libevdev", "mtdev"]
sources = [{ url = "https://gitlab.freedesktop.org/libinput/libinput/-/archive/{version}/libinput-{version}.tar.gz" }]
probes = ["libinput"]

# Keyboards, mice and touchpads, for the compositor.
[package.meson]
args = [
  "-D libwacom=false", "-D debug-gui=false", "-D tests=false", "-D documentation=false",
  "-D udev-dir=$PREFIX/lib/udev",
]

[[package]]
id = "seatd"
version = "0.9.1"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "systemd"]
sources = [{ url = "https://git.sr.ht/~kennylevinsen/seatd/archive/{version}.tar.gz" }]
probes = ["libseat"]

# libseat, which the compositor opens displays and input devices through, with logind.
[package.meson]
args = [
  "-D libseat-logind=systemd", "-D server=disabled", "-D examples=disabled",
  "-D man-pages=disabled",
]

[[package]]
id = "hwdata"
version = "0.413"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/vcrhonek/hwdata/archive/v{version}/hwdata-{version}.tar.gz" }]
script = '''
# The names of hardware vendors and devices, which libdisplay-info reads monitors' makers from.
./configure --prefix=$PREFIX --datadir=$PREFIX/share --disable-blacklist
make install DESTDIR=$DEST
'''

[[package]]
id = "libdisplay-info"
version = "0.3.0"
hold = { below = "0.4", reason = "Smithay, in niri, takes versions below 0.4" }
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "hwdata", "python3"]
sources = [{ url = "https://gitlab.freedesktop.org/emersion/libdisplay-info/-/releases/{version}/downloads/libdisplay-info-{version}.tar.xz" }]
probes = ["display-info"]

# What a monitor says about itself.
[package.meson]

[[package]]
id = "mako"
version = "1.3.10"
scope = "runtime"
core = true
sources = [{ url = "https://files.pythonhosted.org/packages/source/m/mako/mako-{version}.tar.gz" }]
script = '''
mkdir -p $DEST$PREFIX/site
cp -r mako $DEST$PREFIX/site/
'''

[[package]]
id = "packaging"
version = "25.0"
scope = "runtime"
core = true
sources = [{ url = "https://files.pythonhosted.org/packages/source/p/packaging/packaging-{version}.tar.gz" }]
script = '''
mkdir -p $DEST$PREFIX/site
cp -r src/packaging $DEST$PREFIX/site/
'''

[[package]]
id = "pyyaml"
version = "6.0.3"
scope = "runtime"
core = true
sources = [{ url = "https://files.pythonhosted.org/packages/source/p/pyyaml/pyyaml-{version}.tar.gz" }]
script = '''
# Only its pure Python part, which is all the build tools that read YAML need.
mkdir -p $DEST$PREFIX/site
cp -r lib/yaml $DEST$PREFIX/site/
'''

[[package]]
id = "glslang"
version = "16.6.0"
scope = "runtime"
core = true
extra_deps = ["cmake", "ninja", "python3"]
sources = [{ url = "https://github.com/KhronosGroup/glslang/archive/{version}/glslang-{version}.tar.gz" }]
smoke = ["bin/glslangValidator --version"]

# The GLSL compiler, which Mesa compiles its built-in Vulkan shaders with. Without the SPIR-V
# optimizer, which nothing here uses.
[package.cmake]
args = ["-DENABLE_OPT=OFF", "-DGLSLANG_TESTS=OFF", "-DBUILD_SHARED_LIBS=ON"]

[[package]]
id = "mesa"
version = "26.3.0"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "mako", "markupsafe", "pyyaml", "packaging", "libdrm",
  "wayland",
  "wayland-protocols", "expat", "elfutils", "systemd", "bison-final",
  "flex", "m4-final",
  "glslang",
]
sources = [{ url = "https://archive.mesa3d.org/mesa-{version}.tar.xz" }]
probes = ["egl", "gbm"]

# OpenGL and Vulkan for AMD GPUs: radeonsi and RADV, which compile shaders with ACO, so without
# LLVM. softpipe draws without a GPU, slowly, so a shell still starts on a machine without one
# here, such as a VM. EGL and GBM for Wayland compositors.
[package.meson]
env = { PYTHONPATH = "$LAB_DEP_mako/site:$LAB_DEP_markupsafe/site:$LAB_DEP_pyyaml/site:$LAB_DEP_packaging/site" }
args = [
  "-D platforms=wayland", "-D gallium-drivers=radeonsi,softpipe", "-D vulkan-drivers=amd",
  "-D llvm=disabled", "-D egl=enabled", "-D gbm=enabled", "-D gles2=enabled", "-D glx=disabled",
  "-D xlib-lease=disabled", "-D valgrind=disabled", "-D libunwind=disabled",
  "-D lmsensors=disabled", "-D video-codecs=all", "-D microsoft-clc=disabled",
  "-D amd-use-llvm=false", "-D build-tests=false",
]

# Drawing text and shapes: images, fonts and their shaping, and the 2D libraries on top.

[[package]]
id = "libpng"
version = "1.6.59"
scope = "runtime"
core = true
extra_deps = ["cmake", "ninja", "zlib"]
sources = [{ url = "https://github.com/pnggroup/libpng/archive/v{version}/libpng-{version}.tar.gz" }]
probes = ["libpng"]

[package.cmake]
args = ["-DPNG_STATIC=OFF", "-DPNG_TESTS=OFF", "-DPNG_TOOLS=OFF"]

[[package]]
id = "freetype"
version = "2.15.0"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "libpng"]
sources = [{ url = "https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.xz" }]
probes = ["freetype2"]

# Without HarfBuzz, which is built on FreeType.
[package.meson]
args = [
  "-D harfbuzz=disabled", "-D png=enabled", "-D zlib=system", "-D brotli=disabled",
  "-D bzip2=disabled", "-D tests=disabled",
]

[[package]]
id = "harfbuzz"
version = "15.1.0"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "python3", "freetype", "glib"]
sources = [{ url = "https://github.com/harfbuzz/harfbuzz/releases/download/{version}/harfbuzz-{version}.tar.xz" }]
probes = ["harfbuzz", "harfbuzz-gobject"]

# With its GObject library, which bindings made from Pango's typelib link, such as Ghostty's.
[package.meson]
args = [
  "-D freetype=enabled", "-D glib=enabled", "-D gobject=enabled", "-D cairo=disabled",
  "-D icu=disabled", "-D chafa=disabled", "-D introspection=disabled", "-D tests=disabled",
  "-D docs=disabled", "-D utilities=disabled",
]

[[package]]
id = "fribidi"
version = "1.0.18"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf"]
sources = [{ url = "https://github.com/fribidi/fribidi/releases/download/v{version}/fribidi-{version}.tar.xz" }]
probes = ["fribidi"]

[package.meson]
args = ["-D docs=false", "-D bin=false", "-D tests=false"]

[[package]]
id = "fontconfig"
version = "2.17.1"
hold = { below = "2.18", reason = "2.18 needs Meson 1.11" }
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "gperf", "freetype", "expat",
]
sources = [{ url = "https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/{version}/fontconfig-{version}.tar.xz" }]
probes = ["fontconfig"]

# Finds fonts by name. The configuration and cache are in /etc and /var, where the system keeps
# them.
[package.meson]
args = [
  "--sysconfdir=/etc", "--localstatedir=/var", "-D doc=disabled", "-D tests=disabled",
  "-D tools=enabled", "-D nls=disabled",
]

[[package]]
id = "cairo"
version = "1.18.6"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "pixman", "fontconfig",
  "glib", "libX11", "libXext", "libXrender",
]
sources = [{ url = "https://cairographics.org/releases/cairo-{version}.tar.xz" }]
probes = ["cairo"]

# With Xlib, which GTK 3's X11 backend draws through.
[package.meson]
args = [
  "-D xlib=enabled", "-D xcb=disabled", "-D lzo=disabled", "-D tests=disabled",
  "-D spectre=disabled", "-D symbol-lookup=disabled", "-D glib=enabled", "-D png=enabled",
  "-D freetype=enabled", "-D fontconfig=enabled",
]

[[package]]
id = "pango"
version = "1.56.4"
hold = { below = "1.58", reason = "1.58 needs glib 2.88" }
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "harfbuzz", "fribidi",
  "cairo",
]
sources = [{ url = "https://download.gnome.org/sources/pango/{series}/pango-{version}.tar.xz" }]
probes = ["pango", "pangocairo"]

[package.meson]
args = [
  "-D introspection=disabled", "-D documentation=false", "-D build-testsuite=false",
  "-D build-examples=false", "-D libthai=disabled", "-D xft=disabled", "-D cairo=enabled",
  "-D fontconfig=enabled", "-D freetype=enabled",
]

# The compositor.

[[package]]
id = "niri"
version = "26.04"
scope = "runtime"
core = true
extra_deps = [
  "rust-bin", "pkgconf", "libinput", "libxkbcommon", "mesa", "seatd", "libdisplay-info",
  "pango",
  "libevdev", "mtdev", "wayland",
]
sources = [{ url = "https://github.com/niri-wm/niri/archive/v{version}/niri-{version}.tar.gz" }]
smoke = ["bin/niri --version"]

# The lock takes Smithay from git, at the commit it pins. Without screen casting, which needs
# PipeWire and the GNOME portal.
[package.cargo]
default_features = false
features = ["systemd"]
install = '''
mkdir -p $DEST$PREFIX/lib/systemd/user $DEST$PREFIX/share/wayland-sessions \
    $DEST$PREFIX/share/xdg-desktop-portal $DEST$PREFIX/share/niri
cp resources/niri-session $DEST$PREFIX/bin/
cp resources/niri.service resources/niri-shutdown.target $DEST$PREFIX/lib/systemd/user/
cp resources/niri.desktop $DEST$PREFIX/share/wayland-sessions/
cp resources/niri-portals.conf $DEST$PREFIX/share/xdg-desktop-portal/
# The defaults a system's config includes before its settings, without starting waybar, which
# settings can't take back, and which a shell such as noctalia replaces.
grep -v '^spawn-at-startup "waybar"$' resources/default-config.kdl \
    > $DEST$PREFIX/share/niri/default-config.kdl
'''

# Logging in and sound.

[[package]]
id = "greetd"
version = "0.10.3"
scope = "runtime"
core = true
extra_deps = ["rust-bin", "linux-pam"]
sources = [{ url = "https://git.sr.ht/~kennylevinsen/greetd/archive/{version}.tar.gz" }]
smoke = ["bin/greetd --help"]

[package.cargo]
programs = ["greetd", "agreety"]

[[package]]
id = "tuigreet"
version = "0.9.1"
scope = "runtime"
core = true
extra_deps = ["rust-bin"]
sources = [{ url = "https://github.com/tuigreet/tuigreet/archive/{version}/tuigreet-{version}.tar.gz" }]
smoke = ["bin/tuigreet --version"]

[[package]]
id = "alsa-lib"
version = "1.2.16.1"
scope = "runtime"
core = true
sources = [{ url = "https://www.alsa-project.org/files/pub/lib/alsa-lib-{version}.tar.bz2" }]
probes = ["alsa"]

[package.autotools]
args = ["--disable-python", "--disable-static", "--without-debug"]

[[package]]
id = "lua"
version = "5.4.9"
scope = "runtime"
core = true
sources = [{ url = "https://www.lua.org/ftp/lua-{version}.tar.gz" }]
script = '''
# Lua builds with a plain Makefile and has no pkg-config file, so one is written here. Programs
# embed it as a static library.
make linux MYCFLAGS=-fPIC -j$NPROC
make install INSTALL_TOP=$DEST$PREFIX
mkdir -p $DEST$PREFIX/lib/pkgconfig
cat > $DEST$PREFIX/lib/pkgconfig/lua.pc <<PC
prefix=$PREFIX
includedir=\${prefix}/include
libdir=\${prefix}/lib

Name: Lua
Description: An embeddable scripting language
Version: 5.4
Libs: -L\${libdir} -llua -lm
Cflags: -I\${includedir}
PC
'''
smoke = ["bin/lua -v"]
probes = ["lua"]

[[package]]
id = "pipewire"
version = "1.6.11"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "python3", "alsa-lib", "dbus", "glib", "bluez", "sbc"]
sources = [{ url = "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/{version}/pipewire-{version}.tar.gz" }]
smoke = ["bin/pipewire --version"]
probes = ["libpipewire-0.3"]

# Audio through ALSA, with the PulseAudio server for programs that speak it, run as each user's
# service, and Bluetooth headphones through BlueZ, with SBC. Every optional feature is off unless
# named, and the session manager is WirePlumber, built on its own.
[package.meson]
args = [
  "-D auto_features=disabled", "-D session-managers=[]", "-D alsa=enabled",
  "-D pipewire-alsa=enabled", "-D dbus=enabled", "-D libsystemd=enabled",
  "-D systemd-user-service=enabled", "-D systemd-system-service=disabled",
  "-D udevrulesdir=$PREFIX/lib/udev/rules.d", "-D udev=enabled", "-D spa-plugins=enabled",
  "-D support=enabled", "-D audioconvert=enabled", "-D audiomixer=enabled",
  "-D control=enabled", "-D volume=enabled", "-D flatpak=disabled", "-D examples=disabled",
  "-D tests=disabled", "-D man=disabled", "-D docs=disabled", "-D bluez5=enabled",
  "-D bluez5-backend-hfp-native=enabled", "-D bluez5-backend-hsp-native=enabled",
]

[[package]]
id = "wireplumber"
version = "0.5.19"
scope = "runtime"
core = true
# Its library finds its modules by adding their directory to its own at run time.
whole = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "pipewire", "glib", "lua", "systemd",
]
sources = [{ url = "https://gitlab.freedesktop.org/pipewire/wireplumber/-/archive/{version}/wireplumber-{version}.tar.gz" }]
smoke = ["bin/wireplumber --version"]

# The session manager: it links PipeWire's devices and streams, by its Lua scripts.
[package.meson]
args = [
  "-D system-lua=true", "-D introspection=disabled", "-D doc=disabled", "-D tests=false",
  "-D dbus-tests=false", "-D elogind=disabled", "-D systemd=enabled",
  "-D systemd-user-service=true", "-D systemd-system-service=false",
]

[[package]]
id = "rtkit"
version = "0.14"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "dbus", "libcap", "polkit"]
sources = [{ url = "https://gitlab.freedesktop.org/pipewire/rtkit/-/archive/v{version}/rtkit-v{version}.tar.gz" }]

# Gives processes that ask, such as PipeWire, realtime priority within limits.
[package.meson]
prepare = '''
# Its D-Bus description goes into the program as bytes, which it would make with xxd.
od -An -v -tx1 org.freedesktop.RealtimeKit1.xml | tr -s ' \n' '\n' | sed '/^$/d; s/^/0x/' \
    | paste -sd, > xml-introspection.h
# Its users file goes with its own files, instead of where systemd keeps its own.
sed -i "s|^sysusersdir = ''|sysusersdir = '$PREFIX/lib/sysusers.d'|" meson.build
'''
args = [
  "-D installed_tests=false", "-D libsystemd=enabled",
  "-D dbus_interfacedir=$PREFIX/share/dbus-1/interfaces",
  "-D dbus_rulesdir=$PREFIX/share/dbus-1/system.d",
  "-D dbus_systemservicedir=$PREFIX/share/dbus-1/system-services",
  "-D polkit_actiondir=$PREFIX/share/polkit-1/actions",
  "-D systemd_systemunitdir=$PREFIX/lib/systemd/system",
]

# Desktop portals, which programs open files and share screens through.

[[package]]
id = "json-glib"
version = "1.10.8"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "glib",
]
sources = [{ url = "https://download.gnome.org/sources/json-glib/{series}/json-glib-{version}.tar.xz" }]
probes = ["json-glib-1.0"]

[package.meson]
args = [
  "-D introspection=disabled", "-D documentation=disabled", "-D man=false", "-D tests=false",
  "-D nls=disabled",
]

[[package]]
id = "fuse3"
version = "3.18.3"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf"]
sources = [{ url = "https://github.com/libfuse/libfuse/releases/download/fuse-{version}/fuse-{version}.tar.gz" }]
probes = ["fuse3"]

# The library only: fusermount3 has to be setuid, which a wrapper gives it when a system needs it.
[package.meson]
args = ["-D utils=false", "-D examples=false", "-D tests=false", "-D useroot=false"]

[[package]]
id = "gdk-pixbuf"
version = "2.44.8"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "glib",
  "libpng",
]
sources = [{ url = "https://download.gnome.org/sources/gdk-pixbuf/{series}/gdk-pixbuf-{version}.tar.xz" }]
