core = true
sources = [{ url = "https://www.lua.org/ftp/lua-{version}.tar.gz" }]
script = '''
# Lua builds with a plain Makefile and has no pkg-config file, so one is written here. Programs
# embed it as a static library.
make linux MYCFLAGS=-fPIC -j$NPROC
make install INSTALL_TOP=$DEST$PREFIX
mkdir -p $DEST$PREFIX/lib/pkgconfig
cat > $DEST$PREFIX/lib/pkgconfig/lua.pc <<PC
prefix=$PREFIX
includedir=\${prefix}/include
libdir=\${prefix}/lib

Name: Lua
Description: An embeddable scripting language
Version: 5.4
Libs: -L\${libdir} -llua -lm
Cflags: -I\${includedir}
PC
'''
