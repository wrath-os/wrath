probes = ["gcr-base-3", "gck-1"]

# The certificate and key library GNOME Keyring uses, without its GTK widgets.
# It asks where ssh-add is even with its SSH agent off.
[package.meson]
prepare = '''
# Its install script updates caches a system makes for itself, and a link for compatibility.
sed -i "/^meson.add_install_script('meson_post_install.py',/,/^)/d" meson.build
'''
args = [
  "-D gtk=false", "-D introspection=false", "-D gtk_doc=false", "-D ssh_agent=false",
  "-D systemd=enabled", "-D gpg_path=/run/system/bin/gpg",
]

