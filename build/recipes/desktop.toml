    -D session-managers=[] -D alsa=enabled -D pipewire-alsa=enabled -D dbus=enabled \
    -D libsystemd=enabled -D systemd-user-service=enabled -D systemd-system-service=disabled \
    -D udevrulesdir=$PREFIX/lib/udev/rules.d -D udev=enabled -D spa-plugins=enabled \
