[[package]]
id = "wireplumber"
version = "0.5.19"
scope = "runtime"
core = true
# Its library finds its modules by adding their directory to its own at run time.
whole = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "pipewire", "glib", "lua", "systemd", "pcre2", "libffi",
  "util-linux", "zlib",
]
sources = [{ url = "https://gitlab.freedesktop.org/pipewire/wireplumber/-/archive/{version}/wireplumber-{version}.tar.gz" }]
script = '''
# The session manager: it links PipeWire's devices and streams, by its Lua scripts.
meson setup /build/b --prefix=$PREFIX --libdir=lib --buildtype=release -D system-lua=true \
