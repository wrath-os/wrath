# PNG built in, which is what icons are.
[package.meson]
args = [
  "-D png=enabled", "-D jpeg=disabled", "-D tiff=disabled", "-D gif=disabled",
  "-D others=disabled", "-D glycin=disabled", "-D builtin_loaders=png",
  "-D introspection=disabled", "-D documentation=false", "-D man=false", "-D tests=false",
  "-D installed_tests=false", "-D thumbnailer=disabled", "-D gio_sniffing=false",
]

[[package]]
id = "gstreamer"
version = "1.28.9"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "bison-final", "m4-final", "flex", "glib",
]
sources = [{ url = "https://gstreamer.freedesktop.org/src/gstreamer/gstreamer-{version}.tar.xz" }]
probes = ["gstreamer-1.0"]

[package.meson]
args = [
  "-D introspection=disabled", "-D doc=disabled", "-D tests=disabled", "-D examples=disabled",
  "-D benchmarks=disabled", "-D ptp-helper=disabled", "-D libunwind=disabled",
  "-D libdw=disabled", "-D bash-completion=disabled", "-D nls=disabled",
]

[[package]]
id = "gst-plugins-base"
version = "1.28.9"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "gstreamer",
