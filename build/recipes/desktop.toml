]
crates = "Cargo.lock"
sources = [{ url = "https://github.com/Supreeeme/xwayland-satellite/archive/v{version}/xwayland-satellite-{version}.tar.gz" }]
script = '''
# Runs Xwayland for niri and turns X windows into Wayland ones. Its bindings to xcb-util-cursor are
# made with bindgen, which reads the headers with libclang.
awk -F'"' '
    /^name = / { name = $2 }
    /^version = / { version = $2 }
    /^checksum = / {
        printf "{\"files\":{},\"package\":\"%s\"}\n", $2 > ("vendor/" name "-" version "/.cargo-checksum.json")
    }
' Cargo.lock
mkdir -p .cargo
cat > .cargo/config.toml <<CONFIG
[source.crates-io]
replace-with = "vendored"
[source.vendored]
directory = "vendor"
CONFIG
export CARGO_HOME=/build/cargo RUSTFLAGS="--remap-path-prefix=/build/src=/src"
export LIBCLANG_PATH=$LAB_DEP_llvm/lib
cargo build --release --offline --locked -j $NPROC --features systemd
mkdir -p $DEST$PREFIX/bin
cp target/release/xwayland-satellite $DEST$PREFIX/bin/
'''

