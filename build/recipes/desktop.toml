sources = [{ url = "https://codeberg.org/dnkl/fcft/archive/{version}.tar.gz" }]
probes = ["fcft"]

# Fonts drawn into pixman images, for fuzzel.
[package.meson]
args = [
  "-D docs=disabled", "-D grapheme-shaping=disabled", "-D run-shaping=disabled",
  "-D test-text-shaping=false",
]

[[package]]
id = "fuzzel"
version = "1.12.0"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "tllist", "fcft", "pixman", "libxkbcommon", "wayland",
  "wayland-protocols", "libpng", "scdoc",
]
sources = [{ url = "https://codeberg.org/dnkl/fuzzel/archive/{version}.tar.gz" }]
smoke = ["bin/fuzzel --version"]

# The launcher: it lists the programs with a .desktop file and starts the one picked.
[package.meson]
args = ["-D enable-cairo=disabled", "-D png-backend=libpng", "-D svg-backend=nanosvg"]

# PulseAudio's client library alone, which programs that play sound through PulseAudio load, such
# as browsers from their projects. PipeWire's PulseAudio server answers them, so there's no daemon.
[[package]]
id = "libpulse"
version = "17.0"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "python3", "m4-final", "libsndfile"]
sources = [{ url = "https://www.freedesktop.org/software/pulseaudio/releases/pulseaudio-{version}.tar.xz" }]
probes = ["libpulse"]

[package.meson]
args = [
  "-D auto_features=disabled", "-D daemon=false", "-D client=true", "-D doxygen=false",
  "-D man=false", "-D tests=false", "-D database=simple", "-D bashcompletiondir=no",
  "-D zshcompletiondir=no",
]
