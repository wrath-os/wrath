  { from = "share/glib-2.0/schemas", run = "bin/glib-compile-schemas share/glib-2.0/schemas" },
]
sources = [{ url = "https://download.gnome.org/sources/glib/{series}/glib-{version}.tar.xz" }]
smoke = ["bin/gio version", "bin/glib-compile-schemas --version"]
probes = ["glib-2.0", "gio-2.0"]
check_in_view = true
check = "meson test -C /build/b --num-processes $NPROC --print-errorlogs"

[package.meson]
args = [
    "-D tests=true", "-D introspection=disabled", "-D man-pages=disabled", "-D selinux=disabled",
    "-D xattr=false",
]

# Goes in the seed, which has to point its binaries at wherever it's unpacked.
[[package]]
id = "patchelf"
version = "0.18.0"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/NixOS/patchelf/releases/download/{version}/patchelf-{version}.tar.bz2" }]
smoke = ["bin/patchelf --version"]

[package.autotools]
