# The rest of the base system. `core = true` builds with the tools below instead of the seed's.

# The core tools come first, built with what's left of the seed.

[[package]]
id = "coreutils"
scope = "runtime"
toolset = true
toolchain_limits = true
sources = [{ url = "https://ftp.gnu.org/gnu/coreutils/coreutils-9.7.tar.xz" }]
script = '''
FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=$PREFIX --disable-nls --enable-no-install-program=kill,uptime
make -j$NPROC
make install DESTDIR=$DEST
'''
smoke = ["bin/ls --version", "bin/cat --version", "bin/sort --version"]
check_build = "make -j$NPROC check TESTS="
check = "make -j$NPROC check XFAIL_TESTS='test-chown test-fchownat test-lchown tests/chgrp/basic.sh tests/chgrp/default-no-deref.sh tests/chgrp/no-x.sh tests/chgrp/posix-H.sh tests/chgrp/recurse.sh'"

