./configure --prefix=$PREFIX --disable-debuginfod --enable-libdebuginfod=dummy --disable-nls
make -j$NPROC
make install DESTDIR=$DEST
rm -f $DEST$PREFIX/lib/lib*.a
'''
smoke = ["bin/eu-readelf --version"]
probes = ["elf"]
check_in_view = true
check_build = "make -j$NPROC check TESTS="
check = "make -j$NPROC check"

[[package]]
id = "glib"
scope = "runtime"
core = true
toolchain_limits = true
extra_deps = ["meson", "ninja", "python3", "pkgconf", "zlib", "pcre2", "libffi", "util-linux", "gettext"]
sources = [{ url = "https://download.gnome.org/sources/glib/2.84/glib-2.84.4.tar.xz" }]
script = '''
meson setup /build/b --prefix=$PREFIX --buildtype=release -D tests=true -D introspection=disabled \
    -D man-pages=disabled -D selinux=disabled -D xattr=false
ninja -C /build/b -j$NPROC
DESTDIR=$DEST ninja -C /build/b install
'''
smoke = ["bin/gio version", "bin/glib-compile-schemas --version"]
probes = ["glib-2.0", "gio-2.0"]
check_in_view = true
check = "meson test -C /build/b --num-processes $NPROC --print-errorlogs"

# Goes in the seed, which has to point its binaries at wherever it's unpacked.
[[package]]
id = "patchelf"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0.tar.bz2" }]
script = '''
./configure --prefix=$PREFIX
make -j$NPROC
make install DESTDIR=$DEST
'''
smoke = ["bin/patchelf --version"]
