# Reaching a machine over the network: the SSH server and client, and wifi.

[[package]]
id = "openssh"
version = "10.0p1"
scope = "runtime"
core = true
extra_deps = ["openssl", "zlib", "linux-pam", "libxcrypt"]
sources = [{ url = "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-{version}.tar.gz" }]
script = '''
./configure --prefix=$PREFIX --sbindir=$PREFIX/bin --sysconfdir=/etc/ssh --with-pam \
    --with-privsep-path=/var/empty --with-privsep-user=sshd --with-pid-dir=/run \
    --disable-strip --without-hardening-link
make -j$NPROC
make install-nokeys DESTDIR=$DEST
'''
smoke = ["bin/ssh -V", "bin/ssh-keygen -q -t ed25519 -N '' -f /tmp/key"]

[[package]]
id = "iwd"
version = "3.12"
scope = "runtime"
core = true
extra_deps = ["readline", "dbus", "pkgconf", "python3"]
sources = [{ url = "https://mirrors.edge.kernel.org/pub/linux/network/wireless/iwd-{version}.tar.xz" }]
smoke = ["bin/iwctl --help", "libexec/iwd --version"]

# The wifi daemon and its `iwctl`. It carries ell, the library it's built on.
# readline needs ncurses linked beside it, which its configure check doesn't add.
[package.autotools]
args = [
    "--sysconfdir=/etc", "--localstatedir=/var", "--libexecdir=$PREFIX/libexec",
    "--disable-manual-pages", "--with-dbus-datadir=$PREFIX/share",
    "--with-dbus-busdir=$PREFIX/share/dbus-1/system-services",
    "--with-systemd-unitdir=$PREFIX/lib/systemd/system",
    "--with-systemd-networkdir=$PREFIX/lib/systemd/network",
    "--with-systemd-modloaddir=$PREFIX/lib/modules-load.d",
]
env = { LIBS = "-lncursesw" }

[[package]]
id = "wireless-regdb"
version = "2026.09.03"
scope = "runtime"
core = true
sources = [{ url = "https://mirrors.edge.kernel.org/pub/software/network/wireless-regdb/wireless-regdb-{version}.tar.xz" }]
script = '''
# Which radio frequencies and powers each country allows, which the kernel loads as firmware.
install -Dm644 regulatory.db regulatory.db.p7s -t $DEST$PREFIX/lib/firmware
'''
