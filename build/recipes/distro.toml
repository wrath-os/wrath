# distro itself, from this repository, and the agent the VM tests drive a system through.

[[package]]
id = "distro"
scope = "runtime"
core = true
extra_deps = ["rust-bin"]
sources = [{ url = "tree:..", include = ["Cargo.toml", "Cargo.lock", "crates", "modules"] }]
smoke = ["bin/distro --version", "bin/distro-agent --help"]

[package.cargo]
packages = ["distro-cli", "distro-agent"]
programs = ["distro", "distro-agent"]
install = '''
mkdir -p $DEST$PREFIX/share/distro $DEST$PREFIX/lib/systemd/system
cp -r modules $DEST$PREFIX/share/distro/
cat > $DEST$PREFIX/lib/systemd/system/distro-agent.service <<UNIT
[Unit]
Description=distro test harness agent
# A switch it runs would end with it.
X-RestartIfChanged=false

[Service]
Environment=PATH=/run/wrappers/bin:/run/system/bin
ExecStart=$PREFIX/bin/distro-agent
Restart=always
UNIT
'''
