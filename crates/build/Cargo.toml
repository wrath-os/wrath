[package]
name = "wrath-build"
description = "The store, the sandbox, the seed and the action graph systems are built with"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "wrath_build"

[dependencies]
wrath-starlark.workspace = true
memchr = "2"
rustix = { version = "1.1", features = ["fs", "process", "termios"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
toml.workspace = true
zstd = "0.13"
ed25519-dalek = "2.2"
ureq = "3.5"
tar = "0.4"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
