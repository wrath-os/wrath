[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
allocative = "0.3"
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
insta = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starlark = "0.14"
starlark_derive = "0.14"
tempfile = "3"
thiserror = "2"
toml = "0.9"
toml_edit = "0.23"
vsock = "0.5"

distro-agent = { path = "crates/agent" }
distro-backend = { path = "crates/backend" }
distro-check = { path = "crates/check" }
distro-eval = { path = "crates/eval" }
distro-model = { path = "crates/model" }
distro-starlark = { path = "crates/starlark" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies such as the Starlark interpreter are optimized even in dev builds, so tests and
# benchmarks run at a realistic speed. The workspace's own crates stay unoptimized.
[profile.dev.package."*"]
opt-level = 2
