[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
insta = "1"
mlua = { version = "0.12", features = ["luau"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
vsock = "0.5"

distro-agent = { path = "crates/agent" }
distro-check = { path = "crates/check" }
distro-eval = { path = "crates/eval" }
distro-luau = { path = "crates/luau" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
