[system]
hostname = "box"

[desktop]
session = "niri"

[programs.niri.settings]
prefer-no-csd = true
spawn-at-startup = [["mako"], ["sh", "-c", "echo hi"]]
layout.gaps = 12
'output "eDP-1"'.scale = 2.0

[[programs.niri.settings.window-rule]]
'match app-id="firefox"' = true
open-maximized = [true]

[users.ann]
