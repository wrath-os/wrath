<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/run/system/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/30-metric-aliases.conf</include>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/40-nonlatin.conf</include>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/45-generic.conf</include>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/45-latin.conf</include>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/48-guessfamily.conf</include>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/48-spacing.conf</include>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/49-sansserif.conf</include>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Iosevka Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/50-user.conf</include>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/60-generic.conf</include>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/60-latin.conf</include>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/65-nonlatin.conf</include>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/70-no-bitmaps-except-emoji.conf</include>
  <include ignore_missing="yes">/run/system/share/fontconfig/conf.avail/90-synthetic.conf</include>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
