title = "a system switches as the plan said, rolls back, and tries another"

[vm]
config = "fixtures/configs/native"
store = "distro"
wait_for = ["agent", "unit:multi-user.target"]
steps = [
  { apply_config = "fixtures/configs/native-web", expect_plan = ["+ nginx-main.service", "+ /etc/nginx/main.conf"] },
  { run = "systemctl is-active nginx-main; grep -c 'listen 8080' /etc/nginx/main.conf; cat /srv/blog/index.html", stdout_contains = "active\n1\n<h1>blog</h1>" },
  { run = "systemctl show -p MainPID --value nginx-main > /tmp/pid" },
  { apply_config = "fixtures/configs/native-web-changed", expect_plan = ["~ nginx-main.service"] },
  { run = "grep -c 'listen 8081' /etc/nginx/main.conf; test \"$(systemctl show -p MainPID --value nginx-main)\" != \"$(cat /tmp/pid)\" && echo restarted", stdout_contains = "1\nrestarted" },
  { apply_config = "fixtures/configs/native", expect_plan = ["- nginx-main.service"] },
  { run = "systemctl is-active nginx-main; test -e /etc/nginx/main.conf || echo gone", stdout_contains = "inactive\ngone" },
  { run = "distro rollback", stdout_contains = "generation 3" },
  { run = "systemctl is-active nginx-main; grep -c 'listen 8081' /etc/nginx/main.conf", stdout_contains = "active\n1" },
  { run = "distro rollback 2", stdout_contains = "generation 2" },
  { run = "grep -c 'listen 8080' /etc/nginx/main.conf", stdout_contains = "1" },
  { apply_config = "fixtures/configs/native", try_for = "10s" },
  { run = "systemctl is-active nginx-main; true", stdout_contains = "inactive" },
  { run = "sleep 15; systemctl is-active nginx-main", stdout_contains = "active" },
]
timeout_secs = 300
