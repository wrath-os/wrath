title = "a machine upgrading on its own fetches from a cache on its network and builds nothing"
notes = "The host pushes what it built to a cache served at http://10.0.2.100, the only thing the VM reaches. The configuration it follows then trusts that cache and adds a package the image never had."

[vm]
config = "scenarios/fixtures/native-follow-cache"
store = "wrath"
cache = true
wait_for = ["agent", "unit:multi-user.target"]
steps = [
  { run = "mkdir -p /srv/m && cp -r /run/wrath-share/configs/native-follow-cache /srv/m/box && sed -i '1i packages = [\"jq\"]' /srv/m/box/system.toml && cat /run/wrath-share/cache.toml >> /srv/m/box/system.toml && echo ready", stdout_contains = "ready" },
  { run = "command -v jq || echo no jq", stdout_contains = "no jq" },
  # The plan fetches jq and builds nothing.
  { run = "wrath --source grapes=/run/system/grapes plan 2>&1 | grep -o 'to get there: .*'", stdout_contains = "to get there: fetch" },
  { run = "wrath --source grapes=/run/system/grapes plan 2>&1 | grep -c 'build [0-9]' || true", stdout_contains = "0" },
  { run = "wrath --source grapes=/run/system/grapes apply --automatic 2>&1 | tail -3; jq --version", stdout_contains = "jq-" },
  { run = "wrath status 2>&1 | grep -o 'the last automatic upgrade, .*'", stdout_contains = "up to date with" },
  # Nothing was built here: the seed was never needed.
  { run = "ls /wrath/work/seed/ready-* 2>/dev/null || echo no seed", stdout_contains = "no seed" },
]
timeout_secs = 600
