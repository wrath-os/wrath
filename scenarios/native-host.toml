title = "a machine booted from an image knows what it has, and the host switches it over SSH"
notes = "The VM reaches no cache. What it was built from comes with the image, and what `apply --host` adds comes with the switch, so planning on the machine builds and fetches nothing."

[vm]
config = "scenarios/fixtures/native-host"
store = "wrath"
wait_for = ["agent", "unit:multi-user.target", "unit:sshd.service"]
steps = [
  # The records of the image's own build came along, and the machine finds its system by them.
  { run = "ls /wrath/work/hints | wc -l | grep -qv '^0$' && test -n \"$(ls /wrath/work/builds)\" && echo records", stdout_contains = "records" },
  { run = "cp -r /run/wrath-share/configs/native-host /tmp/image && wrath --source grapes=/run/system/grapes -C /tmp/image plan 2>&1", stdout_contains = "no changes" },
  { run = "command -v jq || echo no jq", stdout_contains = "no jq" },
  # From the host: a package the image never had, and a file.
  { apply_host = "scenarios/fixtures/native-host-changed" },
  { run = "cat /etc/hello; jq --version", stdout_contains = "from the host\njq-" },
  # Its configuration isn't on it, as a test image's isn't, but status still says what runs.
  { run = "wrath status 2>/dev/null; true", stdout_contains = "running generation 2" },
  # jq's records came with it: planning that configuration here needs nothing.
  { run = "cp -r /run/wrath-share/configs/native-host-changed /tmp/changed && wrath --source grapes=/run/system/grapes -C /tmp/changed plan 2>&1", stdout_contains = "no changes" },
]
timeout_secs = 600
