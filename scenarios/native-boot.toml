title = "a system boots, and the agent answers"

[vm]
config = "fixtures/configs/native"
store = "wrath"
wait_for = ["agent", "unit:multi-user.target"]
steps = [
  { run = "cat /etc/os-release; uname -n", stdout_contains = "ID=wrath\nPRETTY_NAME=\"wrath\"\nnative" },
  { run = "grep -h ^title /boot/loader/entries/*.conf | sort -u", stdout_contains = "title wrath\n" },
  { run = "id -un john; id -nG john", stdout_contains = "john\nusers wheel" },
  { run = "stat -c '%a %U' /run/wrath/wrappers/bin/sudo; su john -c 'id -un; sudo -n true 2>&1 | head -1'", stdout_contains = "4755 root\njohn\nsudo: a password is required" },
  { run = "busctl call org.freedesktop.PolicyKit1 /org/freedesktop/PolicyKit1/Authority org.freedesktop.DBus.Properties Get ss org.freedesktop.PolicyKit1.Authority BackendName", stdout_contains = "js" },
  { run = "systemctl is-system-running --wait; systemctl --failed --no-legend", stdout_contains = "running" },
  { run = "readlink /run/system", stdout_contains = "/wrath/store/" },
  { run = "systemctl is-active systemd-resolved; grep -c 127.0.0.53 /etc/resolv.conf", stdout_contains = "active\n1" },
  { run = "su john -c 'bwrap --ro-bind / / --unshare-all --dev /dev --proc /proc id -un' 2>&1", stdout_contains = "john" },
  { run = "test $(grep -c 'BEGIN CERTIFICATE' /etc/ssl/certs/ca-certificates.crt) -gt 100 && echo trusted; test -s /etc/pki/tls/certs/ca-bundle.crt && echo fedora; su - john -c 'echo $SSL_CERT_FILE'", stdout_contains = "trusted\nfedora\n/etc/ssl/certs/ca-certificates.crt" },
  { run = "systemd-run -M john@ --user --wait --quiet true; sleep 1; su john -c 'journalctl --user -n 1 --no-pager >/dev/null && echo readable'; test -d /var/log/journal && echo on disk", stdout_contains = "readable\non disk" },
]
timeout_secs = 120
