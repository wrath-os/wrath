[system]
hostname = "native"

[users.john]
extra_groups = ["wheel"]

[units."backup.service"]
Service = { Type = "oneshot", ExecStart = "touch /run/backup-changed" }

[units."backup.timer"]
Timer.OnCalendar = "daily"

[units."report.service"]
Service = { Type = "oneshot", ExecStart = "touch /run/report-ran" }

[units."report.timer"]
Timer.OnActiveSec = "1s"
