# A machine whose next generation will fail a boot check; this one is the good one it falls
# back to. It says so through a notifier.
[system]
hostname = "h-01"

[disks.main]
partitions.esp = { size = "512M", format = "vfat", mount = "/boot" }
partitions.system = { size = "rest" }

[filesystems.root]
on = ["main.system"]
subvolumes."@root" = { mount = "/" }
subvolumes."@wrath" = { mount = "/wrath" }

[files."/etc/notified.sh"]
text = "#!/bin/sh\ncat > /var/lib/notified\n"
mode = 0o755

[notify.to.log]
kind = "command"
command = ["/etc/notified.sh"]
