title = "a system logs people in over SSH with their keys, and refuses passwords"

[vm]
config = "scenarios/fixtures/native-ssh"
store = "distro"
wait_for = ["agent", "unit:multi-user.target", "unit:sshd.service"]
steps = [
  { run = "cat /etc/ssh/authorized_keys.d/john", stdout_contains = "declared" },
  { run = "stat -c %a /etc/ssh/ssh_host_ed25519_key", stdout_contains = "600" },
  { run = "ssh-keygen -q -t ed25519 -N '' -f /root/key && install -d -m 700 -o john -g users /home/john/.ssh && install -m 600 -o john -g users /root/key.pub /home/john/.ssh/authorized_keys && echo ok", stdout_contains = "ok" },
  { run = "ssh -i /root/key -o StrictHostKeyChecking=accept-new -o BatchMode=yes john@localhost 'id -un; echo $XDG_RUNTIME_DIR'", stdout_contains = "john\n/run/user/1000" },
  { run = "ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o PreferredAuthentications=password john@localhost true 2>&1; true", stdout_contains = "Permission denied" },
  { run = "systemctl is-active nftables && nft list table inet distro | grep -c 'policy drop\\|nd-neighbor-solicit\\|tcp dport 22'", stdout_contains = "active\n3" },
  { run = "readlink /etc/localtime", stdout_contains = "/run/system/share/zoneinfo/Europe/Stockholm" },
  { run = "date +%Z | grep -qE '^CES?T$' && echo zone ok", stdout_contains = "zone ok" },
  { run = "getent hosts native-ssh || echo none", stdout_contains = "native-ssh" },
  { run = "test -z \"$(systemctl --failed --no-legend)\" && echo none failed", stdout_contains = "none failed" },
]
timeout_secs = 180
