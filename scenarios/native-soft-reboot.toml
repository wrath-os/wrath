title = "a soft reboot keeps the setuid wrappers, the secrets and the files filled in with them"
notes = "A soft reboot starts systemd again without the first program, which sets these up at boot, and takes down the filesystems they're on; wrath-soft-reboot.service sets them up again."

[vm]
config = "scenarios/fixtures/native-secrets"
store = "wrath"
wait_for = ["agent", "unit:multi-user.target"]
steps = [
  # The fixture key from fixtures/configs/secrets, made for tests only.
  { run = "mkdir -p /etc/wrath-test && printf '%s\\n' 'AGE-SECRET-KEY-1230EQ7RDPZ24LFM247UGU3MZGZF53CX20QMC8VQUEFE0MMGE5HHS0UY6A7' > /etc/wrath-test/identity.txt && echo placed", stdout_contains = "placed" },
  { apply_config = "scenarios/fixtures/native-secrets-changed", expect_plan = ["~ /etc/app/env"] },
  { soft_reboot = true },
  { run = "cat /run/wrath/secrets/api-token; cat /etc/app/env", stdout_contains = "token-one\nTOKEN=token-one\nMODE=staging" },
  { run = "findmnt -no FSTYPE /run/wrath/wrappers; test -u /run/wrath/wrappers/bin/unix_chkpwd && echo setuid", stdout_contains = "tmpfs\nsetuid" },
  # What runs now is what booted: units that start from the booted system get the new one.
  { run = "[ \"$(readlink /run/system-booted)\" = \"$(readlink /run/system)\" ] && echo booted", stdout_contains = "booted" },
  { run = "systemctl is-active wrath-soft-reboot.service; test -z \"$(systemctl --failed --no-legend)\" && echo none failed", stdout_contains = "active\nnone failed" },
  # A full boot sets all of it up before systemd, so the unit has nothing to do.
  { reboot = true },
  { run = "systemctl show --value --property=ConditionResult wrath-soft-reboot.service; cat /run/wrath/secrets/api-token", stdout_contains = "no\ntoken-one" },
]
timeout_secs = 400
