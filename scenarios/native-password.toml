title = "a new user starts with the password hash the configuration gives"

[vm]
config = "scenarios/fixtures/native-password"
store = "host"
wait_for = ["agent", "unit:multi-user.target"]
expect = [
  { run = "grep -c '^demo:[$]6[$]usrviewtest[$]' /etc/shadow", stdout_contains = "1" },
]
timeout_secs = 600
