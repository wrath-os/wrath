title = "a new user starts with the password hash the configuration gives, and can unlock with it"

[vm]
config = "scenarios/fixtures/native-password"
store = "wrath"
wait_for = ["agent", "unit:multi-user.target"]
# A lock screen runs as its user, so PAM checks the password through the setuid helper, which
# reads it up to a NUL.
expect = [
  { run = "grep -c '^demo:[$]6[$]usrviewtest[$]' /etc/shadow", stdout_contains = "1" },
  { run = "grep -ac /run/wrappers/bin/unix_chkpwd /run/system/lib/security/pam_unix.so", stdout_contains = "1" },
  { run = '''su demo -c "printf 'wrath\0' | /run/wrappers/bin/unix_chkpwd demo nullok" && echo unlocked''', stdout_contains = "unlocked" },
  { run = '''su demo -c "printf 'wrong\0' | /run/wrappers/bin/unix_chkpwd demo nullok" || echo refused''', stdout_contains = "refused" },
]
timeout_secs = 600
