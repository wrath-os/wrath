# Wired and wireless networks with networkd, and DNS with resolved.

[system]
hostname = "box"

[networking.networks.lan]
match = ["enp*", "wlan*", "wlp*"]
priority = 10
ipv6_privacy = true
accept_ra = true
ignore_carrier_loss = "3s"
sections.Network.LLDP = "yes"

[networking.dns]
fallback = ["9.9.9.9", "149.112.112.112"]
dnssec = "no"
cache = "no-negative"

[services.tailscale]
enable = true
trust_interface = true
