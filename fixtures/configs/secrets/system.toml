# Secrets encrypted with age next to the configuration. test-identity.txt is a key made for this
# fixture only; the secrets are encrypted to it.

[system]
hostname = "box"
secret_identities = ["/etc/distro-test/identity.txt"]
secret_recipients = ["age1752tz55mdpnqrasdfja6pzw76jhqf532f2dhr5jpkngrfhz5ec0sax8ykl"]

[secrets.api-token]
owner = "syncthing"

[secrets.sync-key]
file = "secrets/api-token.age"
mode = 0o440
path = "/var/lib/syncthing/key.pem"

[services.syncthing.main]
key = { secret = "sync-key" }

# A file with a secret in it, filled in on the machine.
[files."/etc/app/env"]
text = "TOKEN=${secret.api-token}\nMODE=prod\n"
owner = "syncthing"
