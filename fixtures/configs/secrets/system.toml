# Secrets encrypted with age next to the configuration. test-identity.txt is a key made for this
# fixture only; the secrets are encrypted to it.

[system]
hostname = "box"
secret_identities = ["/etc/distro-test/identity.txt"]

[secrets.api-token]
owner = "syncthing"

[secrets.sync-key]
file = "secrets/api-token.age"
mode = 0o440
path = "/var/lib/syncthing/key.pem"

[services.syncthing.main]
key = { secret = "sync-key" }
