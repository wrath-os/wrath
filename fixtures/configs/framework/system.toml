# The Framework Desktop booted from a USB stick: a console login and SSH with a key, on the wired
# network the machine gets an address on by DHCP.

# A terminal and a launcher, which niri starts with Mod+T and Mod+D, and tools to fetch with.
packages = ["alacritty", "fuzzel", "curl", "git", "jujutsu", "wget"]

[system]
hostname = "framework"

[services.ssh]
enable = true

[users.demo]
extra_groups = ["wheel"]
initial_hashed_password = '$6$usrviewtest$lznQtfeGuvyRFdMEqskIFTTDmMnQNb/ECA5pDQf2oZ6K8HEuc9akWa0uPcvPi1ZcRwM85wBzGdCEAsUj3BnFQ/'
authorized_keys = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzm5RyD+1nfy1LquvkEog4SZtPgdhzjr49jSC8PAinp alternate"]

# Logging in to the tailnet stays a step on the machine: `sudo tailscale up` prints a link.
[services.tailscale]
enable = true

# The MediaTek MT7925 wifi, which needs its firmware and the country's radio rules.
[networking.wireless]
enable = true
country = "SE"

[hardware]
firmware = ["linux-firmware"]

# The niri desktop, logged in to at the greeter, with sound.
[audio]
enable = true

[desktop]
session = "niri"

# Programs downloaded for other distributions run, finding their libraries through /lib64.
[programs.foreign]
enable = true
